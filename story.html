  ctx.save(); ctx.translate(s.x, y); ctx.rotate(s.rot);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); s.pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.closePath(); ctx.stroke();
  ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(4, -3, 4, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(-6, 5, 2.5, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* ---------- Cinematic intro flow ---------- */
const CI = { i: 0, typer: null, typing: false, full: '', stars: [], cv: null, ctx: null, w: 0, h: 0 };
function introSteps() { return INTRO[S.lang]; }
function openIntro() {
  clearInterval(S.typer); clearInterval(CI.typer);
  S.phase = 'intro'; CI.i = 0;
  const el = $('#cinema'); el.hidden = false; el.classList.remove('gone');
  resizeCine();
  showIntroStep();
}
function cineType(text, speedMs, isOra) {
  clearInterval(CI.typer); CI.full = text; CI.ora = isOra; CI.typing = true;
  const el = $('#cineText'); let i = 0;
  if (isOra) {
    const paint = () => { el.innerHTML = typedHtml(text, i, true); };
    paint();
    CI.typer = setInterval(() => {
      i++; paint();
      if (i % 2 === 0) sfx.talk();
      if (i >= text.length) { clearInterval(CI.typer); CI.typing = false; }
    }, speedMs);
  } else {
    // cinematic title: every letter is laid out from the start, then fades in where it sits
    el.innerHTML = [...text].map(c => `<span class="ch">${esc(c)}</span>`).join('');
    const spans = el.querySelectorAll('.ch');
    CI.typer = setInterval(() => {
      if (spans[i]) spans[i].classList.add('on');
      i++;
      if (i >= spans.length) { clearInterval(CI.typer); CI.typing = false; }
    }, speedMs);
  }
}
function titleSwell(alert) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime + 0.02;
  vox(master, 'sine', alert ? 49 : 55, t, 3.2, 0.09, 0.6);
  vox(master, 'triangle', alert ? 98 : 110, t, 3, 0.03, 0.8, 600);
  vox(master, 'sine', alert ? 1318 : 1760, t + 0.1, 2.2, 0.006, 1.2);
}
function showIntroStep() {
  const step = introSteps()[CI.i], H = INTRO_HINT[S.lang];
  const el = $('#cinema'), tx = $('#cineText'), hint = $('#cineHint');
  el.classList.toggle('ora', step.k === 'ora' || step.k === 'name');
  el.classList.toggle('naming', step.k === 'name');
  tx.classList.toggle('alert', !!step.alert);
  tx.classList.toggle('big', step.k === 'start');
  requestAnimationFrame(() => fit(cineFace, '#cineFace'));
  if (step.k === 'start') { clearInterval(CI.typer); CI.typing = false; tx.textContent = 'KEYQUEST'; hint.textContent = H.start; return; }
  if (step.k === 'name') tx.innerHTML = esc(fmt(introSteps()[CI.i - 1].text));
  if (step.k === 'name') {
    const inp = $('#nameInput'); inp.value = S.name || ''; hint.textContent = H.name;
    setTimeout(() => inp.focus(), 30);
    return;
  }
  hint.textContent = H.next;
  if (step.fx === 'heartbeat') heartbeat();
  if (step.fx === 'boot') bootChime();
  if (step.k === 'title' && !step.fx) titleSwell(false);
  if (step.fx === 'heartbeat') titleSwell(true);
  cineType(fmt(step.text), step.k === 'title' ? 38 : 26, step.k === 'ora');
}
function introAdvance() {
  if (introSteps()[CI.i].k === 'name') { confirmName(); return; }
  if (CI.busy) return;
  if (CI.typing) {
    clearInterval(CI.typer); CI.typing = false;
    if (CI.ora) $('#cineText').innerHTML = typedHtml(CI.full, CI.full.length, true);
    else $('#cineText').querySelectorAll('.ch').forEach(c => c.classList.add('on'));
    return;
  }
  const go = () => {
    CI.i++;
    if (CI.i >= introSteps().length) { closeIntro(); return; }
    showIntroStep();
  };
  const step = introSteps()[CI.i];
  if (step.k === 'title') {
    // fade the title card out before the next one
    const tx = $('#cineText'); CI.busy = true; tx.classList.add('fading');
    setTimeout(() => { tx.classList.remove('fading'); CI.busy = false; go(); }, 520);
  } else go();
}
function confirmName() {
  const v = $('#nameInput').value.replace(/[\[\]{}<>]/g, '').trim().slice(0, 16);
  S.name = v || INTRO_HINT[S.lang].defName; save();
  $('#nameInput').blur(); sfx.unlock();
  CI.i++; showIntroStep();
}
function closeIntro() {
  clearInterval(CI.typer); CI.typing = false;
  if (!S.name) { S.name = INTRO_HINT[S.lang].defName; save(); }
  const el = $('#cinema'); el.classList.add('gone');
  setTimeout(() => { el.hidden = true; }, 900);
  startLevel(firstOpen());
}
function resizeCine() {
  const cv = $('#cineStars'), r = cv.getBoundingClientRect();
  CI.cv = cv; CI.ctx = cv.getContext('2d'); CI.w = r.width; CI.h = r.height;
  cv.width = Math.round(r.width); cv.height = Math.round(r.height);
  CI.stars = Array.from({ length: 220 }, () => ({ a: Math.random() * Math.PI * 2, r: Math.random() * Math.max(CI.w, CI.h) * 0.6, v: 0.4 + Math.random() * 1.2 }));
  fit(cineFace, '#cineFace');
}
function drawCine(now) {
  const c = CI.ctx; if (!c || !CI.w) return;
  c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(0, 0, CI.w, CI.h);
  const cx = CI.w / 2, cy = Math.min(CI.h / 2, 420), maxR = Math.hypot(CI.w, CI.h) / 2;
  CI.stars.forEach(s => {
    s.r += s.v * (0.12 + s.r * 0.0016);
    if (s.r > maxR) { s.r = 2 + Math.random() * 30; s.a = Math.random() * Math.PI * 2; }
    const k = s.r / maxR, size = 0.5 + k * 2.2;
    c.fillStyle = `rgba(210,228,255,${Math.min(0.9, 0.1 + k * 1.4)})`;
    c.fillRect(cx + Math.cos(s.a) * s.r, cy + Math.sin(s.a) * s.r, size, size);
  });
  const step = introSteps()[CI.i];
  if (step && (step.k === 'ora' || step.k === 'name')) drawFace(cineFace, now, 'ora', CI.typing, true);
}
$('#cineSkip').onclick = (e) => { e.currentTarget.blur(); initAudio(); closeIntro(); };
$('#introBtn').onclick = (e) => { e.currentTarget.blur(); initAudio(); openIntro(); };
$('#nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); initAudio(); confirmName(); }
});

/* ---------- Input ---------- */
const MODS = ['ShiftLeft','ShiftRight','ControlLeft','ControlRight','AltLeft','AltRight','MetaLeft','MetaRight','CapsLock'];
function shakeLine() { const tl = $('#termLine'); if (tl) { tl.classList.remove('shake'); void tl.offsetWidth; tl.classList.add('shake'); } }

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.phase === 'intro') {
    if (e.target && e.target.id === 'nameInput') return;
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (e.repeat) return; initAudio(); introAdvance(); }
    return;
  }
  if (S.hangarOpen) { if (e.code === 'Escape' || e.code === 'KeyH') { e.preventDefault(); closeHangar(); } return; }
  if (S.phase === 'train' && S.tr) {
    if (e.code === 'Escape') { e.preventDefault(); if (S.tr.replay) endReplay(); else leaveTraining(); return; }
    if (S.tr.done) {
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) { initAudio(); if (S.tr.replay) endReplay(); else startTraining(S.tr.mode, S.tr.tier); } }
      else if (e.code === 'KeyH') { e.preventDefault(); openHangar(); }
      return;
    }
    if (S.tr.mode === 'arcade') { initAudio(); if (arcadeKey(e, true)) e.preventDefault(); return; }
  }
  initAudio();
  const kEl = document.getElementById('k-' + e.code);
  if (kEl) kEl.classList.add('pressed');

  if (e.code === 'Tab') {
    e.preventDefault();
    if (S.phase === 'drill') { S.ch = 0; S.msg = ''; renderTerminal(); renderKeyboard(); }
    return;
  }
  if (S.phase === 'card') {
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) closeCard(); }
    return;
  }
  if (S.phase === 'dialogue' || S.phase === 'complete' || S.phase === 'ending') {
    if (S.phase === 'complete' && e.code === 'KeyH') { e.preventDefault(); openHangar(); return; }
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (S.phase === 'dialogue') advanceDialogue();
      else if (S.phase === 'complete') nextLevel();
      else if (S.ending === 1) startLevel(ACTS[1].from);
    }
    return;
  }
  if (MODS.includes(e.code) || e.repeat) return;
  if (KEY[e.code] || e.code === 'Space') e.preventDefault();
  if (switching()) return;   // station switch card is showing

  if (S.phase === 'combat' || S.phase === 'train') {
    if (e.code === 'Space') return;   // habit-space between words is harmless in combat
    const now = performance.now();
    if (!S.startT) S.startT = now;
    S.total++;
    const chs = [charOf(e.code), (e.key || '').toLowerCase()].filter(Boolean);
    const ok = chs.some(ch => combatKey(ch, now));
    if (ok) {
      S.correct++; S.msg = '';
      const dt = now - S.lastKey; S.lastKey = now;
      S.cadence = S.cadence * 0.65 + (dt < 1500 ? Math.min(1.6, (1000 / dt) / 4) : 0.15) * 0.35;
      sfx.laser();
    } else {
      sfx.err(); S.cadence *= 0.5;
      if (C.heat > 0.3) sfx.vent();
      C.heat = 0; C.over = false; C.streak = 0;
      const tgt = alive(C.lock) ? C.lock : recommended();
      if (tgt) noteMiss(tgt.word, tgt.word[tgt.typed]);
      S.msg = onlineKeys().has(e.code) || !KEY[e.code] ? t('wrongKey') : t('offKey');
      if (kEl) { kEl.classList.add('wrong'); setTimeout(() => kEl.classList.remove('wrong'), 220); }
    }
    renderTerminal(); renderKeyboard(); renderStats();
    if (!ok) shakeLine();
    return;
  }
  const expected = expectedChar();
  if (expected == null) return;

  const mapped = charOf(e.code);
  const ok = mapped === expected || (e.key && e.key.toLowerCase() === expected);
  if (!S.startT) S.startT = performance.now();
  S.total++;

  if (ok) {
    S.correct++; S.msg = '';
    const now = performance.now(), dt = now - S.lastKey; S.lastKey = now;
    const inst = dt < 1500 ? Math.min(1.6, (1000 / dt) / 4) : 0.15;
    S.cadence = S.cadence * 0.65 + inst * 0.35;

    if (S.phase === 'drill') {
      sfx.key();
      if (S.lvl < ACTS[1].from) view.pulses.push({ t: now, i: S.lvl });
      const line = curLine();
      S.ch++;
      if (S.ch >= line.text.length) {
        if (S.lvl < ACTS[1].from || S.repairThen) { sfx.weld(); const np = view.nodePos[Math.min(S.lvl, 4)]; if (np) spawnSparks(np[0], np[1], 14); }
        S.lineIdx++; S.ch = 0;
        if (S.lineIdx >= S.lines.length) { S.lineIdx = S.lines.length - 1; S.ch = line.text.length; drillFinished(); return; }
        lineRemark();
      }
    } else if (S.phase === 'decrypt') {
      sfx.key();
      const d = S.dec, k = d.keys[d.ki];
      d.ch++;
      if (d.ch >= k.k.length) {
        k.open = true; d.ki++; d.ch = 0; sfx.reveal();
        if (d.ki >= d.keys.length) { decryptDone(); return; }
      }
      renderCrtText();
    }
  } else {
    sfx.err();
    S.cadence *= 0.5;
    const pressedOnline = onlineKeys().has(e.code);
    S.msg = pressedOnline || !KEY[e.code] ? t('wrongKey') : t('offKey');
    if (S.phase === 'drill') { const txt = curLine().text, a = txt.lastIndexOf(' ', S.ch - 1) + 1, b = txt.indexOf(' ', S.ch); noteMiss(txt.slice(a, b < 0 ? undefined : b), expected); }
    else if (S.phase === 'decrypt') { const k = S.dec.keys[S.dec.ki]; if (k) noteMiss(k.k, expected); }
    if (kEl) { kEl.classList.add('wrong'); setTimeout(() => kEl.classList.remove('wrong'), 220); }
  }
  renderTerminal(); renderKeyboard(); renderSystems(); renderStats();
  if (!ok) shakeLine();
});
window.addEventListener('keyup', (e) => {
  if (S.phase === 'train' && S.ar) arcadeKey(e, false);
  const el = document.getElementById('k-' + e.code); if (el) el.classList.remove('pressed');
});

function firstOpen(from = 0, to = N - 1) { for (let i = from; i <= to; i++) if (!S.done[S.lang][i]) return i; return from; }
$('#langEN').onclick = (e) => { e.currentTarget.blur(); if (S.phase === 'intro') { S.lang = 'en'; save(); renderChrome(); showIntroStep(); return; } if (S.lang !== 'en') { S.lang = 'en'; save(); const a = ACTS[actOf(S.lvl)]; startLevel(firstOpen(a.from, a.to)); } };
$('#langUK').onclick = (e) => { e.currentTarget.blur(); if (S.phase === 'intro') { S.lang = 'uk'; save(); renderChrome(); showIntroStep(); return; } if (S.lang !== 'uk') { S.lang = 'uk'; save(); const a = ACTS[actOf(S.lvl)]; startLevel(firstOpen(a.from, a.to)); } };
$('#act1').onclick = (e) => { e.currentTarget.blur(); initAudio(); startLevel(firstOpen(ACTS[0].from, ACTS[0].to)); };
$('#act2').onclick = (e) => { e.currentTarget.blur(); initAudio(); startLevel(firstOpen(ACTS[1].from, ACTS[1].to)); };
$('#hangarBtn').onclick = (e) => { e.currentTarget.blur(); initAudio(); if (S.phase === 'train' && S.tr && !S.tr.done) return; S.hangarOpen ? closeHangar() : openHangar(); };
$('#hgCloseBtn').onclick = (e) => { e.currentTarget.blur(); closeHangar(); };
$('#musicBtn').onclick = (e) => { e.currentTarget.blur(); initAudio(); S.music = !S.music; save(); renderChrome(); };
$('#kbBtn').onclick = (e) => { e.currentTarget.blur(); S.kb = !S.kb; save(); renderChrome(); requestAnimationFrame(resize); };
$('#handsBtn').onclick = (e) => { e.currentTarget.blur(); S.hands = !S.hands; save(); renderChrome(); renderKeyboard(); };
$('#soundBtn').onclick = (e) => {
  e.currentTarget.blur(); initAudio();
  S.sound = !S.sound; if (master) master.gain.value = S.sound ? 0.9 : 0; renderChrome();
};

/* ---------- Canvas sizing + loop ---------- */
function fit(obj, sel) {
  const cv = $(sel), r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  obj.cv = cv; obj.ctx = cv.getContext('2d'); obj.w = r.width; obj.h = r.height;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  obj.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function resize() { if (S.hangarOpen) requestAnimationFrame(() => fit(hgShip, '#hgShip')); requestAnimationFrame(updatePads); if (document.getElementById('sideFace')) fit(sideFace, '#sideFace'); fit(view, '#view'); fit(face, '#face'); initStars(); if (S.phase === 'intro') resizeCine(); }
window.addEventListener('resize', resize);
if (window.ResizeObserver) { const ro = new ResizeObserver(() => resize()); ro.observe($('#view')); ro.observe($('#face')); }

let lastNow = performance.now(), lastNoise = 0, lastSig = 0;
function loop(now) {
  const dt = Math.min(50, now - lastNow); lastNow = now;
  if (now - S.lastKey > 900) S.cadence *= 0.985;
  if (view.shake > 0) view.shake -= dt;

  const paused = switching() || S.hangarOpen;
  if (S.phase === 'decrypt' && S.dec) {
    if (!paused) S.dec.left -= dt;
    if (now - lastNoise > 110) { lastNoise = now; renderCrtText(); }
    if (now - lastSig > 200) {
      lastSig = now;
      const bar = $('#sigBar');
      if (bar) { const sig = Math.max(0, S.dec.left / S.dec.total); bar.firstElementChild.style.width = (sig * 100).toFixed(1) + '%'; bar.classList.toggle('low', sig < 0.3); }
    }
    if (S.dec.left <= 0) signalLost();
  }
  if (S.phase === 'combat' && !paused) combatTick(now, dt);
  if (S.phase === 'train' && !paused) trainTick(now, dt);
  else if (S.phase === 'train' && S.tr && S.tr.mode === 'range' && !S.tr.done) S.tr.end += dt;
  if (S.hangarOpen) drawHangarShip(now);

  const target = targetPowers();
  for (let i = 0; i < 5; i++) view.pw[i] += (target[i] - view.pw[i]) * 0.05;
  drawView(now, view.pw);
  drawFace(face, now, S.phase === 'decrypt' ? 'unknown' : S.speaker, S.speaking, false);
  if (S.phase === 'intro') drawCine(now);
  const sm = S.sideModeLast;
  if (sm === 'enemy' || sm === 'combat' || sm === 'repair') {
    if (sm === 'repair') { if (sideFace.ctx) drawShipIcon(sideFace, now); }
    else drawFace(sideFace, now, sm === 'enemy' && (S.phase === 'decrypt' || S.lvl < ACTS[1].from) ? 'unknown' : 'vex', S.speaking && S.speaker !== 'ora', true);
  }
  if ((S.phase === 'combat' || S.phase === 'decrypt') && now - (S.sideAt || 0) > 300) { S.sideAt = now; renderSystems(); }
  updateAudio(now, view.pw);
  requestAnimationFrame(loop);
}

load();
for (let i = 0; i < 5; i++) if (S.done[S.lang][i]) view.assembled[i] = 1;
buildKeyboard();
resize();
renderChrome();
if (!S.name) openIntro(); else startLevel(firstOpen());
requestAnimationFrame(loop);
</script>
