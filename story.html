<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KeyQuest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: the ship's bridge, fitted to one screen.
   Row 1: cockpit window + systems bulkhead. Row 2: comms console (ORA's face, her words, your typing line). Row 3: keyboard deck. */
:root {
  --hull: #080b0e;
  --plate: #111820;
  --plate-2: #0c1218;
  --seam: #212c37;
  --rivet: #2c3946;
  --text: #d6e0e7;
  --muted: #74838f;
  --dim: #34414c;
  --phos: #ffb547;
  --live: #6ff0a8;
  --alert: #ff5a52;
  --hazard: #d99a26;
  --f-display: "Chakra Petch", "Rajdhani", "Segoe UI", sans-serif;
  --f-crt: "VT323", "Courier New", monospace;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--f-mono); color: var(--text); -webkit-font-smoothing: antialiased; user-select: none;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 180px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 140px),
    var(--hull);
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--phos); outline-offset: 2px; }

.app {
  height: 100%; max-width: 1320px; margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(120px, 1fr) auto auto; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (max-width: 820px), (max-height: 600px) { .app { height: auto; grid-template-rows: auto; } .viewport { height: 200px; } }

/* ---------- Hull plates ---------- */
.plate {
  position: relative; border-radius: 10px;
  background: linear-gradient(180deg, var(--plate), var(--plate-2));
  border: 1px solid var(--seam);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 -2px 0 rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.35);
}
.plate::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background:
    radial-gradient(circle at 9px 9px, var(--rivet) 2px, transparent 2.6px),
    radial-gradient(circle at calc(100% - 9px) 9px, var(--rivet) 2px, transparent 2.6px),
    radial-gradient(circle at 9px calc(100% - 9px), var(--rivet) 2px, transparent 2.6px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), var(--rivet) 2px, transparent 2.6px);
}
.tag {
  font-family: var(--f-display); font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: var(--muted); background: #0a0f14; border: 1px solid var(--seam); border-radius: 3px; padding: 2px 7px;
}
.label { font-family: var(--f-display); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

/* ---------- Ceiling bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 16px 8px 22px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .16em; }
.brand .act { font-family: var(--f-display); font-size: 12px; letter-spacing: .18em; color: var(--phos); }
.leds { display: flex; gap: 5px; }
.leds i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.leds i.on { background: var(--live); box-shadow: 0 0 6px var(--live); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--seam); border-radius: 6px; overflow: hidden; background: #0a0f14; }
.seg button { background: transparent; border: 0; padding: 6px 12px; font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; color: var(--muted); cursor: pointer; }
.seg button.on { background: #18212a; color: var(--text); box-shadow: inset 0 -2px 0 var(--phos); }
.btn { background: #0a0f14; border: 1px solid var(--seam); border-radius: 6px; padding: 6px 12px; font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; color: var(--muted); cursor: pointer; }
.btn:hover { color: var(--text); }
.readout { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
.readout div { display: grid; text-align: right; }
.readout span { font-family: var(--f-display); font-size: 10px; letter-spacing: .16em; color: var(--muted); }
.readout b { font-size: 16px; font-weight: 600; }

/* ---------- Bridge: window + systems ---------- */
.bridge { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 10px; min-height: 0; }
@media (max-width: 820px) { .bridge { grid-template-columns: 1fr; } }
.viewport { position: relative; min-height: 0; height: 100%; padding: 8px; }
.viewport canvas { display: block; width: 100%; height: 100%; border-radius: 6px; }
.viewport .tag { position: absolute; left: 22px; bottom: 14px; z-index: 1; }
.systems { padding: 12px; display: grid; gap: 4px; align-content: start; min-height: 0; overflow: auto; }
.systems .tag { justify-self: start; margin-bottom: 4px; }
.sys { display: grid; grid-template-columns: 8px 1fr auto auto; align-items: center; gap: 9px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 7px; cursor: pointer; }
.sys:hover { background: #151d25; }
.sys.current { border-color: var(--seam); background: #151d25; }
.sys .led { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.sys.online .led { background: var(--live); box-shadow: 0 0 8px var(--live); }
.sys.booting .led { background: var(--phos); box-shadow: 0 0 8px var(--phos); animation: blink 1s steps(1) infinite; }
.sys .nm { font-family: var(--f-display); font-size: 13px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sys .keys { font-size: 10px; color: var(--dim); }
.sys .st { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: right; }
.sys.online .st { color: var(--live); }

/* ---------- Comms console (centre of attention) ---------- */
.comms { --tint: var(--phos); display: grid; grid-template-columns: clamp(150px, 19vw, 240px) minmax(0, 1fr); gap: 10px; padding: 12px; }
.comms.enemy { --tint: var(--alert); }
@media (max-width: 820px) { .comms { grid-template-columns: 1fr; } }
.screen {
  position: relative; overflow: hidden; border-radius: 14px / 18px;
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--tint) 9%, #0a0805) 0%, #040302 80%);
  box-shadow: inset 0 0 40px rgba(0,0,0,.9), inset 0 0 0 2px #000, 0 0 0 3px #1a2129;
}
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.26) 0 1px, transparent 1px 3px); }
.face-screen { display: grid; grid-template-rows: auto 1fr; min-height: 190px; }
.face-screen .label { padding: 10px 12px 0; color: color-mix(in srgb, var(--tint) 75%, var(--muted)); display: flex; justify-content: space-between; gap: 8px; font-size: 10px; }
.face-screen canvas { width: 100%; height: 100%; display: block; min-height: 150px; }
.log-screen { display: grid; grid-template-rows: auto auto; align-content: start; gap: 6px; padding: 14px 20px 14px; min-height: 190px; }
.crt-text { font-family: var(--f-crt); font-size: clamp(25px, 2.5vw, 34px); line-height: 1.08; color: var(--tint); text-shadow: 0 0 8px color-mix(in srgb, var(--tint) 65%, transparent); min-height: 2.3em; }
.crt-text .who { opacity: .55; margin-right: .4em; }
.crt-text .caret { animation: blink 1s steps(1) infinite; }
.comms.enemy .crt-text { animation: jitter .18s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes jitter { 50% { transform: translateX(1px); } }

.terminal { border-top: 1px dashed color-mix(in srgb, var(--tint) 30%, transparent); padding-top: 10px; display: grid; gap: 8px; }
.term-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.term-head .kind { color: var(--tint); }
.term-line { font-family: var(--f-mono); font-weight: 500; font-size: clamp(24px, 3.2vw, 38px); letter-spacing: .06em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 2px; min-height: 1.3em; }
.term-line .prompt { color: var(--dim); margin-right: 14px; }
.c { color: #8b9aa6; padding: 0 1px; border-bottom: 3px solid transparent; }
.c.ok { color: var(--live); }
.c.cur { color: #fff; border-bottom-color: var(--cur, var(--phos)); background: color-mix(in srgb, var(--cur, var(--phos)) 20%, transparent); animation: pulse 1.2s ease-in-out infinite; }
.c.sp { color: var(--dim); font-size: .6em; }
.c.sp.ok { color: color-mix(in srgb, var(--live) 50%, var(--dim)); }
@keyframes pulse { 50% { background: color-mix(in srgb, var(--cur, var(--phos)) 34%, transparent); } }
.term-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.term-foot .msg { color: var(--alert); }
.term-foot .finger b { color: var(--text); font-weight: 600; }
.shake { animation: shake .26s; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.waiting { font-size: 15px; color: var(--muted); }
kbd { font-family: var(--f-mono); border: 1px solid var(--seam); border-bottom-width: 3px; border-radius: 5px; padding: 1px 8px; color: var(--text); background: #0d1318; }
.done { display: grid; gap: 8px; }
.done h3 { margin: 0; font-family: var(--f-display); font-size: 24px; letter-spacing: .12em; color: var(--live); }
.done .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 26px; font-variant-numeric: tabular-nums; }
.done .stars { color: var(--phos); font-size: 22px; letter-spacing: .3em; }
.done .row b { font-size: 20px; font-weight: 600; margin-left: 6px; }
.done .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.done.enc h3 { color: var(--alert); }
.progress { height: 4px; background: #151d25; border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--live); transition: width .25s; }

/* ---------- Keyboard deck ---------- */
.deck { padding: 16px 14px 12px; display: grid; gap: 8px; overflow: hidden; }
.deck::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; border-radius: 10px 10px 0 0; opacity: .75;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 9px, #0c1116 9px 18px); }
.deck-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.kb-scroll { overflow-x: auto; }
.kb { display: grid; gap: 5px; min-width: 560px; }
.kr { display: flex; gap: 5px; }
.key { --fc: var(--dim); flex: var(--u) 1 0; min-width: 0; height: clamp(28px, 4.6vh, 46px); border-radius: 7px; position: relative;
  display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 15px; font-weight: 500;
  background: #0b1015; border: 1px solid #161e26; color: #26313b; transition: background .15s, box-shadow .15s, color .15s, transform .06s; }
.key.mod { font-size: 11px; font-family: var(--f-display); letter-spacing: .08em; }
.key.gap { visibility: hidden; }
.key.on { background: linear-gradient(#1a232c, #131a21); border-color: #26313c; color: var(--text); box-shadow: inset 0 -3px 0 var(--fc), 0 2px 0 #04070a; }
.key.target { background: color-mix(in srgb, var(--fc) 34%, #131a21); color: #fff; box-shadow: 0 0 0 2px var(--fc), 0 0 22px color-mix(in srgb, var(--fc) 70%, transparent); z-index: 1; }
.key.pressed { transform: translateY(2px); }
.key.wrong { background: #4a1a1c; box-shadow: 0 0 0 2px var(--alert); color: #fff; }
.key.bump::after { content: ""; position: absolute; bottom: 6px; width: 10px; height: 2px; border-radius: 1px; background: currentColor; opacity: .7; }
.key.powering { animation: powerUp 1.3s ease-out; }
@keyframes powerUp { 0% { background: #0b1015; color: #26313b; } 20% { background: var(--fc); color: #000; } 35% { background: #0b1015; } 50% { background: var(--fc); color: #000; box-shadow: 0 0 26px var(--fc); } 100% { } }
.fingers { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.fp { --fc: var(--dim); font-family: var(--f-display); font-size: 10px; letter-spacing: .12em; padding: 4px 8px; border-radius: 999px; border: 1px solid #1a232c; color: var(--muted); }
.fp i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--fc); margin-right: 6px; vertical-align: 1px; opacity: .55; }
.fp.active { border-color: var(--fc); color: #fff; background: color-mix(in srgb, var(--fc) 22%, transparent); }
.fp.active i { opacity: 1; box-shadow: 0 0 8px var(--fc); }
.fp.split { margin-right: 16px; }

@media (prefers-reduced-motion: reduce) {
  .c.cur, .key.powering, .sys.booting .led, .comms.enemy .crt-text, .shake { animation: none !important; }
}

/* Act 2: decrypt + combat */
.crt-text .noise { opacity: .5; }
.crt-text .kopen { color: #fff; text-shadow: 0 0 12px var(--tint); }
.crt-text .kcur { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; opacity: .9; }
.sig { height: 6px; background: #151d25; border-radius: 3px; overflow: hidden; }
.sig i { display: block; height: 100%; background: var(--phos); }
.sig.low i { background: var(--alert); }
.pips { color: var(--live); letter-spacing: .25em; font-size: 15px; }
.pips .off { color: var(--dim); }

/* Cinematic intro */
.cinema { position: fixed; inset: 0; z-index: 50; background: #000; display: grid; grid-template-rows: 10vh 1fr 10vh; transition: opacity .9s ease; }
.cinema.gone { opacity: 0; pointer-events: none; }
.cinema .bar { background: #000; }
.cinema .stage { position: relative; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 50%, #07111b 0%, #000 72%); }
.cinema #cineStars { position: absolute; inset: 0; width: 100%; height: 100%; }
.cine-inner { position: relative; display: grid; justify-items: center; gap: 22px; max-width: 900px; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cine-title { font-family: var(--f-display); font-size: clamp(20px, 3vw, 34px); letter-spacing: .12em; color: #cfdbe4; text-transform: uppercase; min-height: 2.6em; text-wrap: balance; }
.cine-title.alert { color: var(--alert); text-shadow: 0 0 14px rgba(255,90,82,.5); }
.cine-title.big { font-size: clamp(34px, 6vw, 64px); letter-spacing: .3em; }
.cine-face { width: min(46vw, 300px); aspect-ratio: 20 / 16; display: none; }
.cinema.ora .cine-face { display: block; }
.cinema.ora .cine-title { font-family: var(--f-crt); text-transform: none; letter-spacing: .02em; color: var(--phos); text-shadow: 0 0 10px rgba(255,181,71,.6); font-size: clamp(26px, 3.2vw, 40px); }
.cine-name { display: none; }
.cinema.naming .cine-name { display: block; }
.cine-name input { font-family: var(--f-mono); font-size: 26px; background: transparent; border: 0; border-bottom: 2px solid var(--phos); color: #fff; text-align: center; width: min(70vw, 360px); outline: none; padding: 4px 8px; user-select: text; }
.cine-hint { font-family: var(--f-display); font-size: 11px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; animation: blink 1.6s steps(1) infinite; }
.cine-skip { position: absolute; top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); }
</style>
</head>
<body>
<div class="app">
  <header class="top plate">
    <div class="brand"><h1>KEYQUEST</h1><div class="seg" role="group" aria-label="Act"><button id="act1">ACT 1</button><button id="act2">ACT 2</button></div><span class="act" id="actLabel">COLD BOOT</span><span class="leds" id="leds"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button id="langEN" class="on">EN · QWERTY</button>
        <button id="langUK">UA · ЙЦУКЕН</button>
      </div>
      <button class="btn" id="introBtn">INTRO</button>
      <button class="btn" id="soundBtn">SOUND ON</button>
    </div>
    <div class="readout">
      <div><span>WPM</span><b id="rWpm">0</b></div>
      <div><span>ACC</span><b id="rAcc">100%</b></div>
    </div>
  </header>

  <section class="bridge">
    <div class="viewport plate"><canvas id="view"></canvas><span class="tag">Bridge · Forward view</span></div>
    <div class="systems plate" id="systems"></div>
  </section>

  <section class="comms plate" id="comms">
    <div class="screen face-screen">
      <div class="label"><span id="crtName">ORA · SHIP AI</span><span id="crtChan">CH 01</span></div>
      <canvas id="face"></canvas>
    </div>
    <div class="screen log-screen">
      <div class="crt-text" id="crtText"></div>
      <div class="terminal" id="terminal"></div>
    </div>
  </section>

  <section class="deck plate">
    <div class="deck-head">
      <span class="tag" id="deckLabel">Control deck</span>
      <span class="label" id="deckHint">Space continues · Tab restarts the line</span>
    </div>
    <div class="kb-scroll"><div class="kb" id="kb"></div></div>
    <div class="fingers" id="fingers"></div>
  </section>
</div>

<div class="cinema" id="cinema" hidden>
  <div class="bar"></div>
  <div class="stage">
    <canvas id="cineStars"></canvas>
    <button class="btn cine-skip" id="cineSkip">SKIP</button>
    <div class="cine-inner">
      <canvas class="cine-face" id="cineFace"></canvas>
      <div class="cine-title" id="cineText"></div>
      <div class="cine-name"><input id="nameInput" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Your name"></div>
      <div class="cine-hint" id="cineHint"></div>
    </div>
  </div>
  <div class="bar"></div>
</div>

<script>
/* ======================================================================
   KEYQUEST
   ACT 1 · COLD BOOT     — wake the ship with ORA, learn the home row.
   ACT 2 · FIRST CONTACT — Commander Vex: decrypt his transmissions,
                           then shoot down his raiders by typing words.
   ====================================================================== */

/* ---------- Physical keyboard: [code, finger, width units, en, uk, label] ---------- */
const ROWS = [
  [['Backquote','lp',1,'`',"'"],['Digit1','lp',1,'1','1'],['Digit2','lr',1,'2','2'],['Digit3','lm',1,'3','3'],['Digit4','li',1,'4','4'],['Digit5','li',1,'5','5'],['Digit6','ri',1,'6','6'],['Digit7','ri',1,'7','7'],['Digit8','rm',1,'8','8'],['Digit9','rr',1,'9','9'],['Digit0','rp',1,'0','0'],['Minus','rp',1,'-','-'],['Equal','rp',1,'=','='],['Backspace','rp',2,null,null,'⌫']],
  [['Tab','lp',1.5,null,null,'TAB'],['KeyQ','lp',1,'q','й'],['KeyW','lr',1,'w','ц'],['KeyE','lm',1,'e','у'],['KeyR','li',1,'r','к'],['KeyT','li',1,'t','е'],['KeyY','ri',1,'y','н'],['KeyU','ri',1,'u','г'],['KeyI','rm',1,'i','ш'],['KeyO','rr',1,'o','щ'],['KeyP','rp',1,'p','з'],['BracketLeft','rp',1,'[','х'],['BracketRight','rp',1,']','ї'],['Backslash','rp',1.5,'\\','ґ']],
  [['CapsLock','lp',1.75,null,null,'CAPS'],['KeyA','lp',1,'a','ф'],['KeyS','lr',1,'s','і'],['KeyD','lm',1,'d','в'],['KeyF','li',1,'f','а'],['KeyG','li',1,'g','п'],['KeyH','ri',1,'h','р'],['KeyJ','ri',1,'j','о'],['KeyK','rm',1,'k','л'],['KeyL','rr',1,'l','д'],['Semicolon','rp',1,';','ж'],['Quote','rp',1,"'",'є'],['Enter','rp',2.25,null,null,'ENTER']],
  [['ShiftLeft','lp',2.25,null,null,'SHIFT'],['KeyZ','lp',1,'z','я'],['KeyX','lr',1,'x','ч'],['KeyC','lm',1,'c','с'],['KeyV','li',1,'v','м'],['KeyB','li',1,'b','и'],['KeyN','ri',1,'n','т'],['KeyM','ri',1,'m','ь'],['Comma','rm',1,',','б'],['Period','rr',1,'.','ю'],['Slash','rp',1,'/','.'],['ShiftRight','rp',2.75,null,null,'SHIFT']],
  [['_gapL','th',4],['Space','th',7,' ',' ','SPACE'],['_gapR','th',4]]
];
const KEY = {};
ROWS.flat().forEach(([code, finger, u, en, uk, label]) => { KEY[code] = { code, finger, u, en, uk, label }; });
const BUMPS = new Set(['KeyF', 'KeyJ']);

const FINGER_COLOR = { lp:'#ec4899', lr:'#f97316', lm:'#eab308', li:'#22c55e', th:'#818cf8', ri:'#22d3ee', rm:'#3b82f6', rr:'#a78bfa', rp:'#e879f9' };
const FINGER_NAME = {

const t = (k) => T[S.lang][k];
const L = () => LEVELS[S.lvl];

const actOf = (i) => (i >= ACTS[1].from ? 1 : 0);
function fmt(str) {
  const n = S.name || INTRO_HINT[S.lang].defName;
  return String(str).replace(/\{name\}/g, n).replace(/\{NAME\}/g, n.toUpperCase());
}

function charOf(code, lang = S.lang) { if (code === 'Space') return ' '; return KEY[code] ? KEY[code][lang] : null; }
function codeOf(ch, lang = S.lang) { if (ch === ' ') return 'Space'; for (const c in KEY) if (KEY[c][lang] === ch) return c; return null; }
function keyLabel(code) { return code === 'Space' ? t('space') : (charOf(code) || '').toUpperCase(); }

/* ---------- Save ---------- */
function save() { try { localStorage.setItem('keyquest.story', JSON.stringify({ done: S.done, lang: S.lang, name: S.name })); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('keyquest.story') || localStorage.getItem('keyquest.act1') || 'null');
    if (d && d.done) {
      const pad = (a) => { const b = blank(); (a || []).forEach((v, i) => { if (i < N) b[i] = v; }); return b; };
      S.done = { en: pad(d.done.en), uk: pad(d.done.uk) }; S.lang = d.lang === 'uk' ? 'uk' : 'en';
      if (typeof d.name === 'string') S.name = d.name.slice(0, 16);
    }
  } catch (e) {}
}

/* ---------- Keys / progress ---------- */
function onlineKeys() {
  const set = new Set();
  LEVELS.forEach((lv, i) => {
    const live = i < S.lvl || S.done[S.lang][i] || S.ending || (i === S.lvl && (S.phase !== 'dialogue' || S.levelDone || S.dec));
    if (live) lv.newKeys.forEach(k => set.add(k));
  });
  return set;
}
function curLine() { return S.lines[S.lineIdx]; }
function expectedChar() {
  if (S.phase === 'drill') { const l = curLine(); return l ? l.text[S.ch] : null; }
  if (S.phase === 'decrypt') { const k = S.dec.keys[S.dec.ki]; return k ? k.k[S.dec.ch] : null; }
  if (S.phase === 'combat') { const s = C.ships[0]; return s ? s.word[C.typed] : null; }
  return null;
}
function expectedCode() { const ch = expectedChar(); return ch ? codeOf(ch) : null; }
function liveProgress() {
  if (S.levelDone) return 1;
  if (S.phase !== 'drill' || !S.lines.length) return 0;
  const line = curLine();
  return (S.lineIdx + (line ? S.ch / line.text.length : 0)) / S.lines.length;
}

/* ---------- Pixel faces ---------- */
const face = { cv: null, ctx: null, w: 0, h: 0 };

function drawFace(obj, now, mode, speaking, forcePowered) {
  const c = obj.ctx, W = obj.w, H = obj.h; if (!c || !W) return;
  c.clearRect(0, 0, W, H);
  const enemy = mode !== 'ora';
  const cols = 20, rows = 16;
  const cell = Math.max(3, Math.floor(Math.min(W / cols, H / rows)));
  const ox = Math.floor((W - cols * cell) / 2), oy = Math.floor((H - rows * cell) / 2);
  const rgb = enemy ? '255,90,82' : '255,181,71';
  const powered = forcePowered || S.ending || S.lvl > 0 || S.phase !== 'dialogue' || S.dlgIdx > 0;
  // decrypt: the face is mostly static until the signal is cleaned up
  const clarity = mode === 'unknown' && S.dec ? S.dec.ki / Math.max(1, S.dec.keys.length) : 1;
  const flick = powered ? 1 : (0.55 + 0.45 * Math.random());
  c.shadowColor = `rgba(${rgb},.8)`; c.shadowBlur = cell * 0.9;

  const inside = enemy

        return Math.abs(x - 9.5) <= hw;
      }
    : (x, y) => { const dx = (x - 9.5) / 8.4, dy = (y - 7.8) / 7.3; return dx * dx + dy * dy < 1; };

    c.fillStyle = `rgba(${rgb},${a * flick})`; c.fillRect(ox + x * cell, oy + y * cell, cell - 1, cell - 1);
  };

  const glitchRow = enemy && Math.random() < 0.3 ? (Math.random() * rows) | 0 : -1;
  for (let y = 0; y < rows; y++) {
    const shift = y === glitchRow ? ((Math.random() * 3) | 0) - 1 : 0;
    for (let x = 0; x < cols; x++) {
      if (!inside(x, y)) continue;
      const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
      px(x + shift, y, edge ? 0.95 : 0.13);
    }
  }
  const speakFrame = speaking && Math.floor(now / 90) % 2 === 0;
  if (!enemy) {
    const blink = now % 4200 < 130;
    for (const ex of [6, 12]) { px(ex, 7, 1); px(ex + 1, 7, 1); if (!blink) { px(ex, 6, 1); px(ex + 1, 6, 1); } }
    if (speakFrame) { for (let x = 8; x <= 11; x++) { px(x, 10, 1); px(x, 12, 1); } px(8, 11, 1); px(11, 11, 1); }

    if (mode === 'vex') {           // Vex: swept crest fins + scar

      px(12, 8, 0.8); px(13, 9, 0.8); px(14, 10, 0.8);
    }
    for (let x = 4; x <= 15; x++) px(x, 6, 0.95);
    const scan = 4 + Math.floor(now / 70) % 12; px(scan, 7, 1); px(Math.min(15, scan + 1), 7, 0.6);
    for (let x = 6; x <= 13; x++) if ((x + (speakFrame ? 1 : 0)) % 2) { px(x, 11, 0.9); px(x, 12, 0.6); }

    const b = SP(x, y, X);
    ctx.strokeStyle = `rgba(${col},${on ? 0.45 : cur ? 0.7 : 0.25})`; ctx.setLineDash(on ? [] : [3, 4]);
    ctx.beginPath(); ctx.moveTo(...core); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]);
    const r = cur ? 6 + 2 * Math.sin(now * 0.008) : 5;
    ctx.fillStyle = `rgba(${col},${on || cur ? 1 : .6})`; ctx.shadowColor = `rgb(${col})`; ctx.shadowBlur = on || cur ? 10 : 0;
    ctx.beginPath(); ctx.arc(b[0], b[1], r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.font = '600 10px "IBM Plex Mono", monospace'; ctx.textAlign = 'center';
    ctx.textBaseline = LABEL_BELOW[i] ? 'top' : 'bottom';
    const ly = LABEL_BELOW[i] ? b[1] + 10 : b[1] - 10;
    const label = LEVELS[i].sys[S.lang].toUpperCase() + (cur ? ' ' + Math.round(pw[i] * 100) + '%' : '');
    ctx.fillStyle = `rgba(${col},.95)`; ctx.fillText(label, b[0], ly);
  });
  ctx.fillStyle = `rgba(255,181,71,${0.4 + 0.6 * Math.max(0.05, pw[0])})`; ctx.beginPath(); ctx.arc(core[0], core[1], 4, 0, Math.PI * 2); ctx.fill();
  view.pulses = view.pulses.filter(p => now - p.t < 420);
  view.pulses.forEach(p => {
    const k = (now - p.t) / 420, b = SP(...SYS_NODES[p.i], X);
    const x = core[0] + (b[0] - core[0]) * k, y = core[1] + (b[1] - core[1]) * k;
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#ffb547'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  });
  ctx.restore(); ctx.textAlign = 'left';
}
function drawFlagship(ctx, now, k, dist) {
  const W = view.w, H = view.h;
  const x = W * .42, y = H * .46 + Math.sin(now * .002) * 4;
  const sc = Math.min(W, H) * 0.0055 * (0.35 + k * 1.3);
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.shadowColor = 'rgba(255,90,82,.8)'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#1c0808'; ctx.strokeStyle = 'rgba(255,90,82,.95)'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  [[-34,4],[-14,-6],[-6,-16],[0,-12],[6,-16],[14,-6],[34,4],[12,9],[0,15],[-12,9]].forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py));
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,90,82,.95)'; ctx.fillRect(-8, -3, 16, 3);
  const glow = 0.6 + 0.4 * Math.sin(now * .01);
  ctx.fillStyle = `rgba(255,140,90,${glow})`;
  [[-22, 5], [22, 5]].forEach(([px, py]) => { ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill(); });
  ctx.restore();
  ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,90,82,.95)';
  ctx.fillText((S.lang === 'uk' ? 'ДЖЕРЕЛО СИГНАЛУ · ' : 'SIGNAL SOURCE · ') + km(dist), x, y + 20 * sc + 8);
  ctx.textAlign = 'left';
}
const perimeterX = () => view.w * 0.1;

function drawRaider(ctx, s, now, isTarget) {
  const bob = Math.sin(now * 0.004 + s.phase) * 4;
  const x = s.x, y = s.y + bob;
  ctx.save(); ctx.translate(x, y);
  const body = s.hit > 0 ? '#ffffff' : '#ff5a52';
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(4, -10); ctx.lineTo(16, -14); ctx.lineTo(10, 0); ctx.lineTo(16, 14); ctx.lineTo(4, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a0a0a'; ctx.fillRect(-4, -3, 7, 6);
  ctx.fillStyle = `rgba(255,181,71,${0.6 + 0.4 * Math.random()})`; ctx.fillRect(14, -3, 6 + Math.random() * 6, 6);
  if (isTarget) {
    ctx.strokeStyle = 'rgba(111,240,168,.9)'; ctx.lineWidth = 1.5;
    const r = 26;
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sy]) => {
      ctx.beginPath(); ctx.moveTo(sx * r, sy * (r - 8)); ctx.lineTo(sx * r, sy * r); ctx.lineTo(sx * (r - 8), sy * r); ctx.stroke();
    });
  }
  ctx.restore();
  // word label
  ctx.font = '600 14px "IBM Plex Mono", monospace'; ctx.textBaseline = 'bottom';
  const typed = isTarget ? C.typed : 0;
  const a = s.word.slice(0, typed), b = s.word.slice(typed);
  const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
  const lx = x - (wa + wb) / 2, ly = y - 22;
  ctx.fillStyle = 'rgba(4,6,9,.75)'; ctx.fillRect(lx - 5, ly - 18, wa + wb + 10, 20);
  ctx.fillStyle = '#6ff0a8'; ctx.fillText(a, lx, ly);
  ctx.fillStyle = isTarget ? '#ffffff' : '#c9d4dc'; ctx.fillText(b, lx + wa, ly);
}

function drawView(now, pw) {
  const ctx = view.ctx, W = view.w, H = view.h; if (!ctx || !W) return;
  ctx.save();
  if (view.shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
  ctx.fillStyle = '#02050a'; ctx.fillRect(-10, -10, W + 20, H + 20);

  if (pw[0] > 0.05) {
    const g = ctx.createRadialGradient(W * .28, H * .35, 0, W * .28, H * .35, W * .6);
    g.addColorStop(0, `rgba(48,78,120,${0.22 * pw[0]})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const speed = pw[2] * (0.35 + S.cadence * 3.2);
  for (const s of view.stars) {
    s.x -= s.z * speed;
    if (s.x < -50) { s.x = W + Math.random() * 30; s.y = Math.random() * H; }
    ctx.globalAlpha = (0.25 + 0.65 * pw[0]) * (0.7 + 0.3 * Math.sin(now * 0.002 + s.tw));
    ctx.fillStyle = '#d5e6ff';
    const streak = s.z * speed * 5;
    if (streak > 3) ctx.fillRect(s.x, s.y, Math.min(60, streak), s.z > 1.4 ? 1.6 : 1);
    else ctx.fillRect(s.x, s.y, s.z, s.z);
  }
  ctx.globalAlpha = 1;

  if (pw[4] > 0.01) {
    const px = W * .74, py = H * .42, r = Math.min(W, H) * .2;
    ctx.globalAlpha = pw[4] * (S.phase === 'combat' ? 0.45 : 1);
    const g = ctx.createRadialGradient(px - r * .4, py - r * .4, r * .1, px, py, r);
    g.addColorStop(0, '#8fdcc8'); g.addColorStop(.55, '#2b6e78'); g.addColorStop(1, '#081620');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190,235,225,.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(px, py, r * 1.6, r * .32, -.28, 0, Math.PI * 2); ctx.stroke();
    if (S.phase !== 'combat' && !hostile()) {
      ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(111,240,168,.75)';
      ctx.beginPath(); ctx.moveTo(W * .5, H * .92); ctx.quadraticCurveTo(W * .52, H * .5, px - r * 1.15, py + r * .2); ctx.stroke();
      ctx.setLineDash([]);
      if (pw[4] > 0.99) {
        ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillStyle = 'rgba(111,240,168,.9)'; ctx.fillText('KEPLER-ORA 7 · ' + km(384400 - (S.lvl >= ACTS[1].from ? 120000 : 0)), px, py + r + 10);
        ctx.textAlign = 'left';
      }
    }
    ctx.globalAlpha = 1;
  }

  if (pw[3] > 0.01) {
    const rx = W * .9, ry = H * .68, r = Math.min(W, H) * .11;
    ctx.globalAlpha = pw[3] * (S.phase === 'combat' ? 0.4 : 1);
    ctx.strokeStyle = 'rgba(111,240,168,.45)'; ctx.lineWidth = 1;
    for (const k of [1, .66, .33]) { ctx.beginPath(); ctx.arc(rx, ry, r * k, 0, Math.PI * 2); ctx.stroke(); }
    const a = now * 0.0025;
    for (let i = 0; i < 18; i++) {
      ctx.strokeStyle = `rgba(111,240,168,${0.5 * (1 - i / 18)})`;
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + Math.cos(a - i * .03) * r, ry + Math.sin(a - i * .03) * r); ctx.stroke();
    }
    if (pw[3] > 0.98) {
      const blips = S.lvl >= ACTS[1].from ? [[-.7, .7], [-.4, .5], [-.95, .8]] : [[-.7, .7]];
      blips.forEach(([ang, d]) => {
        ctx.fillStyle = `rgba(255,90,82,${0.5 + 0.5 * Math.sin(now * .008 + ang * 5)})`;
        ctx.beginPath(); ctx.arc(rx + Math.cos(ang) * r * d, ry + Math.sin(ang) * r * d, 3.5, 0, Math.PI * 2); ctx.fill();
      });
    }
    ctx.globalAlpha = 1;
  }

  /* ---- combat layer ---- */
  if (S.phase === 'combat' || C.booms.length || C.lasers.length) {
    if (S.phase === 'combat') {
      ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,90,82,.55)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(perimeterX(), H * .14); ctx.lineTo(perimeterX(), H * .88); ctx.stroke(); ctx.setLineDash([]);
    }
    C.ships.forEach((s, i) => drawRaider(ctx, s, now, i === 0));
    const cn = cannon();
    C.lasers = C.lasers.filter(l => now - l.t < 140);
    C.lasers.forEach(l => {
      const a = 1 - (now - l.t) / 140;
      ctx.strokeStyle = `rgba(111,240,168,${a})`; ctx.lineWidth = 2.5; ctx.shadowColor = '#6ff0a8'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(cn.x + l.off, cn.y); ctx.lineTo(l.x, l.y); ctx.stroke(); ctx.shadowBlur = 0;
    });
    C.booms = C.booms.filter(b => now - b.t < 600);
    C.booms.forEach(b => {
      const k = (now - b.t) / 600;
      ctx.strokeStyle = b.bad ? `rgba(255,90,82,${1 - k})` : `rgba(255,181,71,${1 - k})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, 6 + k * 46, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(255,240,200,${(1 - k) * 0.8})`;
      for (let i = 0; i < 8; i++) { const an = i / 8 * Math.PI * 2 + b.r; ctx.fillRect(b.x + Math.cos(an) * k * 40, b.y + Math.sin(an) * k * 40, 3, 3); }
    });
  }

  // cockpit frame
  const win = [[W * .045, H * .13], [W * .955, H * .13], [W * .985, H * .88], [W * .015, H * .88]];
  ctx.fillStyle = '#0b1015';
  ctx.beginPath(); ctx.rect(-10, -10, W + 20, H + 20);
  ctx.moveTo(...win[0]); win.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath();
  ctx.fill('evenodd');
  ctx.strokeStyle = '#1f2a35'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(...win[0]); win.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = '#0b1015'; ctx.fillRect(W / 2 - 3, -10, 6, H * .13 + 16);
  if (S.lvl >= ACTS[1].from) {   // cannon housing on the sill
    const cn = cannon();
    ctx.fillStyle = '#18222c'; ctx.fillRect(cn.x - 26, cn.y - 4, 52, 12);
    ctx.fillStyle = S.phase === 'combat' ? '#6ff0a8' : '#34414c'; ctx.fillRect(cn.x - 5, cn.y - 10, 10, 8);
  }

  const n = 20;
  for (let i = 0; i < n; i++) {
    const x = W * .07 + i * (W * .86 / (n - 1)), y = H * .94;
    const lit = (i + 1) / n <= pw[1] + 0.001;
    const alarm = hostile() || S.phase === 'combat';
    ctx.fillStyle = lit ? (alarm && Math.floor(now / 400) % 2 ? '#ff5a52' : (i % 4 === 0 ? '#ffb547' : '#6ff0a8')) : '#18212a';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = lit ? 8 : 0;
    ctx.fillRect(x - 4, y - 1.5, 8, 3);
  }
  ctx.shadowBlur = 0;

  const dark = 0.8 * (1 - pw[0]);
  if (dark > 0.01) {
    ctx.fillStyle = `rgba(0,0,0,${Math.max(0, dark - (Math.random() < 0.05 ? 0.2 : 0))})`;
    ctx.fillRect(-10, -10, W + 20, H + 20);
  }

  const vexOnScreen = S.lvl >= ACTS[1].from && (S.phase === 'decrypt' || S.speaker === 'vex' || S.speaker === 'unknown');
  if (vexOnScreen) {
    const prog = S.phase === 'decrypt' && S.dec ? S.dec.ki / S.dec.keys.length : 1;
    drawFlagship(ctx, now, prog, 48000 - 41000 * prog);
  } else if (S.phase !== 'combat' && S.phase !== 'intro') {
    drawSchematic(ctx, now, pw);
  }

  const names = ['PWR', 'O2', 'THR', 'SNS', 'NAV'];
  ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textBaseline = 'top';
  let hx = W * .06;
  names.forEach((nm, i) => {
    const v = i === 0 ? Math.max(0.02, pw[0]) : pw[i];
    const txt = `${nm} ${String(Math.round(v * 100)).padStart(3, ' ')}%`;
    ctx.fillStyle = v >= 0.999 ? 'rgba(111,240,168,.95)' : (v > 0.01 ? 'rgba(255,181,71,.9)' : 'rgba(116,131,143,.55)');
    ctx.fillText(txt, hx, H * .16);
    hx += ctx.measureText(txt).width + 16;
  });
  if (S.phase === 'combat') {
    const pips = '⬢'.repeat(C.shields) + '⬡'.repeat(3 - C.shields);
    ctx.fillStyle = C.shields > 1 ? 'rgba(111,240,168,.95)' : 'rgba(255,90,82,.95)';
    ctx.textAlign = 'right'; ctx.fillText(`SHIELDS ${pips}`, W * .94, H * .16); ctx.textAlign = 'left';
  }

  if (hostile()) {
    ctx.fillStyle = `rgba(255,60,60,${0.08 + 0.06 * Math.sin(now * .006)})`; ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.fillStyle = 'rgba(255,90,82,.95)'; ctx.font = '600 12px "IBM Plex Mono", monospace';
    if (Math.floor(now / 500) % 2) ctx.fillText('◤ INCOMING SIGNAL ◢', W * .06, H * .8);
  }
  ctx.restore();
}

/* ======================================================================
   DOM RENDERING
   ====================================================================== */
function buildKeyboard() {
  const kb = $('#kb'); kb.innerHTML = '';
  ROWS.forEach(row => {
    const r = document.createElement('div'); r.className = 'kr';
    row.forEach(([code, finger, u, en, uk, label]) => {
      const k = document.createElement('div');
      k.id = 'k-' + code;
      k.className = 'key' + (code.startsWith('_') ? ' gap' : '') + (label ? ' mod' : '') + (BUMPS.has(code) ? ' bump' : '');
      k.style.setProperty('--u', u);
      k.style.setProperty('--fc', FINGER_COLOR[finger]);
      r.appendChild(k);
    });
    kb.appendChild(r);
  });
  const fg = $('#fingers'); fg.innerHTML = '';
  ['lp','lr','lm','li','th','ri','rm','rr','rp'].forEach(f => {
    const p = document.createElement('span'); p.className = 'fp' + (f === 'li' || f === 'th' ? ' split' : '');
    p.dataset.f = f; p.style.setProperty('--fc', FINGER_COLOR[f]);
    fg.appendChild(p);
  });
}

function renderKeyboard() {
  const on = onlineKeys();
  const target = expectedCode();
  for (const code in KEY) {
    if (code.startsWith('_')) continue;
    const el = document.getElementById('k-' + code); if (!el) continue;
    const k = KEY[code];
    el.textContent = code === 'Space' ? t('space') : (k.label || (k[S.lang] || '').toUpperCase());
    el.classList.toggle('on', on.has(code));
    el.classList.toggle('target', code === target);
  }
  const tf = target ? KEY[target].finger : null;
  document.querySelectorAll('.fp').forEach(p => {
    p.innerHTML = `<i></i>${FINGER_SHORT[S.lang][p.dataset.f]}`;
    p.classList.toggle('active', p.dataset.f === tf);
  });
}

function charsHtml(text, typedUpTo) {
  return [...text].map((c, i) => {
    const cls = ['c', i < typedUpTo ? 'ok' : (i === typedUpTo ? 'cur' : ''), c === ' ' ? 'sp' : ''].join(' ');
    return `<span class="${cls}">${c === ' ' ? '␣' : esc(c)}</span>`;
  }).join('');
}
function footHtml() {
  const code = expectedCode();
  const finger = code ? FINGER_NAME[S.lang][KEY[code].finger] : '';
  return `<div class="term-foot"><span class="finger">${code ? `${esc(t('next'))}: <b>${esc(keyLabel(code))}</b> · ${esc(finger)}` : ''}</span><span class="msg">${esc(S.msg)}</span></div>`;
}
const cont = (label) => `<div class="waiting"><kbd>${esc(t('spaceKey'))}</kbd> ${esc(label || t('cont'))}</div>`;

function renderTerminal() {
  const el = $('#terminal');
  const lv = L();

  if (S.phase === 'ending' && S.ending === 1) {
    el.innerHTML = `<div class="done enc"><h3>${esc(t('encrypted'))}</h3><div class="waiting">${esc(t('decOff'))}</div>${cont(t('startAct2'))}</div>`;
    return;
  }
  if (S.phase === 'ending' && S.ending === 2) {
    el.innerHTML = `<div class="done"><h3>${esc(t('act2done'))}</h3><div class="label" style="color:var(--phos)">${esc(t('act3'))}</div>
      <div class="actions"><button class="btn" id="bReplay">${esc(t('replay'))}</button><button class="btn" id="bReset">${esc(t('reset'))}</button></div></div>`;
    $('#bReplay').onclick = (e) => { e.currentTarget.blur(); startLevel(ACTS[1].from); };
    $('#bReset').onclick = (e) => { e.currentTarget.blur(); S.done = { en: blank(), uk: blank() }; save(); startLevel(0); };
    return;
  }
  if (S.ending) { el.innerHTML = cont(); return; }

  if (S.levelDone) {
    const stars = [0, 1, 2].map(i => i < S.lastStars ? '★' : '☆').join('');
    const word = lv.type === 'encounter' ? t('cleared') : t('online');
    el.innerHTML = `<div class="done">
      <h3>${esc(lv.sys[S.lang].toUpperCase())} · ${esc(word)}</h3>
      <div class="row"><span class="stars">${stars}</span><span class="label">${esc(t('acc'))}<b>${S.lastAcc}%</b></span><span class="label">${esc(t('wpm'))}<b>${S.lastWpm}</b></span></div>
      ${cont(S.phase === 'complete' ? t('nextSys') : t('cont'))}
    </div>`;
    return;
  }

  if (S.phase === 'dialogue') { el.innerHTML = cont(); return; }

  if (S.phase === 'drill') {
    const line = curLine();
    const kindLabel = line.kind === 'locate' ? t('locate') : (line.kind === 'code' ? lv.codeLabel[S.lang] : (lv.type === 'encounter' ? t('warm') : t('boot')));
    const curCode = codeOf(line.text[S.ch]);
    const curColor = curCode ? FINGER_COLOR[KEY[curCode].finger] : 'var(--phos)';
    el.innerHTML = `
      <div class="term-head"><span class="label kind">${esc(kindLabel)}</span><span class="label">${esc(lv.sys[S.lang])} · ${esc(t('step'))} ${S.lineIdx + 1}/${S.lines.length}</span></div>
      <div class="progress"><i style="width:${(liveProgress() * 100).toFixed(1)}%"></i></div>
      <div class="term-line" id="termLine" style="--cur:${curColor}"><span class="prompt">&gt;</span>${charsHtml(line.text, S.ch)}</div>
      ${footHtml()}`;
    return;
  }

  if (S.phase === 'decrypt') {
    const d = S.dec, k = d.keys[d.ki];
    const sig = Math.max(0, d.left / d.total);
    const curCode = k ? codeOf(k.k[d.ch]) : null;
    const curColor = curCode ? FINGER_COLOR[KEY[curCode].finger] : 'var(--alert)';
    el.innerHTML = `
      <div class="term-head"><span class="label kind">${esc(t('decrypting'))} · ${esc(t('key'))} ${Math.min(d.ki + 1, d.keys.length)}/${d.keys.length}</span><span class="label">${esc(t('signal'))} ${Math.round(sig * 100)}%</span></div>
      <div class="sig ${sig < 0.3 ? 'low' : ''}" id="sigBar"><i style="width:${(sig * 100).toFixed(1)}%"></i></div>
      <div class="term-line" id="termLine" style="--cur:${curColor}"><span class="prompt">&gt;</span>${k ? charsHtml(k.k, d.ch) : ''}</div>
      ${footHtml()}`;
    return;
  }

  if (S.phase === 'combat') {
    const lead = C.ships[0];
    const remaining = C.queue.length + C.ships.length;
    const pips = `<span class="pips">${'⬢'.repeat(C.shields)}<span class="off">${'⬡'.repeat(3 - C.shields)}</span></span>`;
    const curCode = lead ? codeOf(lead.word[C.typed]) : null;
    const curColor = curCode ? FINGER_COLOR[KEY[curCode].finger] : 'var(--live)';
    el.innerHTML = `
      <div class="term-head"><span class="label kind">${esc(t('target'))}</span><span class="label">${esc(t('shields'))} ${pips} · ${remaining} ${esc(t('left'))}</span></div>
      <div class="progress"><i style="width:${((1 - remaining / C.total) * 100).toFixed(1)}%"></i></div>
      <div class="term-line" id="termLine" style="--cur:${curColor}"><span class="prompt">&gt;</span>${lead ? charsHtml(lead.word, C.typed) : `<span class="c">${esc(t('incomingShips'))}</span>`}</div>
      ${footHtml()}`;
  }
}

function renderSystems() {
  const el = $('#systems');
  const a = ACTS[actOf(S.lvl)];
  let html = `<span class="tag">${esc(actOf(S.lvl) ? t('sectors') : t('systems'))}</span>`;
  for (let i = a.from; i <= a.to; i++) {
    const lv = LEVELS[i];
    const stars = S.done[S.lang][i];
    const current = i === S.lvl && !S.ending;
    let cls = 'offline', st = '—';
    if (stars) { cls = 'online'; st = '★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars); }
    else if (current && S.phase === 'drill') { cls = 'booting'; st = Math.round(liveProgress() * 100) + '%'; }
    else if (current && (S.phase === 'decrypt' || S.phase === 'combat')) { cls = 'booting'; st = '!!'; }
    const keys = lv.newKeys.map(keyLabel).join(' ');
    html += `<button class="sys ${cls} ${current ? 'current' : ''}" data-i="${i}"><span class="led"></span><span class="nm">${esc(lv.sys[S.lang])}</span><span class="keys">${esc(keys)}</span><span class="st">${esc(st)}</span></button>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.sys').forEach(b => b.onclick = () => { initAudio(); b.blur(); startLevel(+b.dataset.i); });
}

function renderStats() {
  let wpm = 0;
  if (S.startT && S.correct) wpm = Math.round((S.correct / 5) / Math.max(0.05, (performance.now() - S.startT) / 60000));
  const acc = S.total ? Math.round(S.correct / S.total * 100) : 100;
  $('#rWpm').textContent = wpm; $('#rAcc').textContent = acc + '%';
  return { wpm, acc };
}

function renderChrome() {
  const a = actOf(S.lvl);
  $('#actLabel').textContent = t('acts')[a];
  $('#act1').classList.toggle('on', a === 0);
  $('#act2').classList.toggle('on', a === 1);
  $('#deckLabel').textContent = t('deck');
  $('#deckHint').textContent = t('tabHint');
  $('#soundBtn').textContent = t('sound')[S.sound ? 0 : 1];
  $('#langEN').classList.toggle('on', S.lang === 'en');
  $('#langUK').classList.toggle('on', S.lang === 'uk');
  document.documentElement.lang = S.lang === 'uk' ? 'uk' : 'en';
  const A = ACTS[a], leds = $('#leds');
  leds.innerHTML = '';
  for (let i = A.from; i <= A.to; i++) { const d = document.createElement('i'); if (S.done[S.lang][i]) d.className = 'on'; leds.appendChild(d); }
}

function renderAll() { renderChrome(); renderTerminal(); renderSystems(); renderKeyboard(); renderStats(); renderCrtText(); }

/* ======================================================================
   FLOW
   ====================================================================== */
function buildLines(lv) {
  const lt = lv[S.lang], out = [];
  lv.newKeys.forEach(code => out.push({ kind: 'locate', text: charOf(code).repeat(3), code }));
  lt.drills.forEach(text => out.push({ kind: 'drill', text }));
  if (lv.type === 'boot') out.push({ kind: 'code', text: lt.code });
  return out;
}

function resetCombat() { C.ships = []; C.queue = []; C.lasers = []; C.booms = []; C.typed = 0; C.shields = 3; }

function startLevel(i) {
  clearInterval(S.typer);
  S.lvl = i; S.ending = 0; S.levelDone = false; S.dec = null; S.speaker = 'ora';
  resetCombat();
  S.lines = buildLines(L()); S.lineIdx = 0; S.ch = 0; S.msg = '';
  S.correct = 0; S.total = 0; S.startT = null;
  say(LT().intro, beginDrill);
}

function beginDrill() {
  S.phase = 'drill';
  sfx.unlock();
  L().newKeys.forEach(code => {
    const el = document.getElementById('k-' + code);
    if (el) { el.classList.remove('powering'); void el.offsetWidth; el.classList.add('powering'); }
  });
  lineRemark();
  renderAll();
}

function lineRemark() {
  const line = curLine(); if (!line) return;
  if (line.kind === 'locate') remark(`${t('find')} ${keyLabel(line.code)}. ${FINGER_NAME[S.lang][KEY[line.code].finger]}.`);
  else if (line.kind === 'code') remark(t('lastOne'));
  else if (S.lineIdx === 0 || S.lines[S.lineIdx - 1].kind === 'locate') remark(LT().tip);
}

function drillFinished() {
  if (L().type === 'boot') completeLevel();
  else startDecrypt();
}

/* ---------- Decrypt ---------- */
function parseMsg(s) {
  const segs = [];
  s.split(/(\[[^\]]+\])/).forEach(p => {
    if (!p) return;
    if (p[0] === '[') { const w = p.slice(1, -1); segs.push({ key: true, s: w, k: w.toLowerCase(), open: false }); }
    else segs.push({ key: false, s: p });
  });
  return segs;
}
function startDecrypt() {
  clearInterval(S.typer); S.speaking = false; S.blocking = false;
  const segs = parseMsg(fmt(LT().msg));
  const keys = segs.filter(x => x.key);
  const chars = keys.reduce((a, k) => a + k.k.length, 0);
  const factor = [1, 0.92, 0.85, 0.78][S.lvl - ACTS[1].from] || 0.78;
  const total = (chars * 1150 + keys.length * 1500 + 6000) * factor;
  S.dec = { segs, keys, ki: 0, ch: 0, total, left: total };
  S.speaker = 'unknown'; S.phase = 'decrypt'; S.msg = '';
  sfx.glitch();
  renderAll();
}
function decryptDone() {
  const plain = S.dec.segs.map(sg => sg.s).join('');
  S.dec = null;
  sfx.online();
  say([{ who: 'vex', text: plain }, LT().after], startCombat);
}
function signalLost() {
  S.dec = null; sfx.glitch();
  say([t('signalLost')], startDecrypt);
}

/* ---------- Combat ---------- */
function startCombat() {
  resetCombat();
  C.queue = [...LT().wave]; C.total = C.queue.length; C.last = -1e9;
  S.speaker = 'ora'; S.phase = 'combat'; S.msg = '';
  renderAll();
}
function combatTick(now, dt) {
  const lv = L(), W = view.w, H = view.h;
  if (C.queue.length && C.ships.length < 3 && now - C.last > lv.gap) {
    C.last = now;
    C.ships.push({ word: C.queue.shift(), x: W + 30, y: H * (0.3 + Math.random() * 0.42), vx: (W * 0.85) / lv.cross, hit: 0, phase: Math.random() * 6 });
    renderTerminal(); renderKeyboard();
  }
  C.ships.forEach(s => { s.x -= s.vx * dt; if (s.hit > 0) s.hit -= dt; });
  const lead = C.ships[0];
  if (lead && lead.x < perimeterX()) {
    C.ships.shift(); C.typed = 0; C.shields--;
    C.booms.push({ x: lead.x, y: lead.y, t: now, r: Math.random(), bad: true });
    view.shake = 350; sfx.breach(); flashPlate();
    if (C.shields <= 0) { defeatSting(); S.phase = 'dialogue'; say([t('breach')], startCombat); return; }
    renderTerminal(); renderKeyboard();
  }
  if (!C.queue.length && !C.ships.length && S.phase === 'combat') completeLevel();
}
function flashPlate() {
  const v = $('.viewport'); v.style.boxShadow = '0 0 0 2px var(--alert), 0 0 30px rgba(255,90,82,.5)';
  setTimeout(() => { v.style.boxShadow = ''; }, 300);
}

/* ---------- Level end / endings ---------- */
function completeLevel() {
  const { wpm, acc } = renderStats();
  const stars = acc >= 97 ? 3 : acc >= 90 ? 2 : 1;
  S.lastStars = stars; S.lastWpm = wpm; S.lastAcc = acc;
  S.done[S.lang][S.lvl] = Math.max(S.done[S.lang][S.lvl], stars);
  save();
  S.levelDone = true;
  fanfare(L().type === 'encounter');
  const lt = LT();
  const lines = L().type === 'encounter' ? [{ who: 'vex', text: lt.retreat }, lt.outro] : [lt.outro];
  say(lines, () => { S.phase = 'complete'; S.speaker = 'ora'; renderAll(); });
}

function nextLevel() {
  if (S.lvl === ACTS[0].to) startEnding(1);
  else if (S.lvl === ACTS[1].to) startEnding(2);
  else startLevel(S.lvl + 1);
}

function startEnding(n) {
  clearInterval(S.typer);
  S.ending = n; S.levelDone = false;
  if (n === 1) {
    sfx.glitch();
    say(ACT1_END[S.lang].map(text => ({ who: 'unknown', text })), () => { S.phase = 'ending'; renderAll(); });
  } else {
    fanfare(true);
    S.phase = 'ending'; S.speaker = 'ora'; renderAll();
  }
}

/* ---------- Cinematic intro flow ---------- */
const CI = { i: 0, typer: null, typing: false, full: '', stars: [], cv: null, ctx: null, w: 0, h: 0 };
function introSteps() { return INTRO[S.lang]; }
function openIntro() {
  clearInterval(S.typer); clearInterval(CI.typer);
  S.phase = 'intro'; CI.i = 0;
  const el = $('#cinema'); el.hidden = false; el.classList.remove('gone');
  resizeCine();
  showIntroStep();
}
function cineType(text, speedMs, talk) {
  clearInterval(CI.typer); CI.full = text; CI.typing = true;
  const el = $('#cineText'); let i = 0;
  CI.typer = setInterval(() => {
    i++; el.textContent = text.slice(0, i);
    if (talk && i % 2 === 0) sfx.talk();
    if (i >= text.length) { clearInterval(CI.typer); CI.typing = false; }
  }, speedMs);
}
function showIntroStep() {
  const step = introSteps()[CI.i], H = INTRO_HINT[S.lang];
  const el = $('#cinema'), tx = $('#cineText'), hint = $('#cineHint');
  el.classList.toggle('ora', step.k === 'ora' || step.k === 'name');
  el.classList.toggle('naming', step.k === 'name');
  tx.classList.toggle('alert', !!step.alert);
  tx.classList.toggle('big', step.k === 'start');
  requestAnimationFrame(() => fit(cineFace, '#cineFace'));
  if (step.k === 'start') { clearInterval(CI.typer); CI.typing = false; tx.textContent = 'KEYQUEST'; hint.textContent = H.start; return; }
  if (step.k === 'name') {
    const inp = $('#nameInput'); inp.value = S.name || ''; hint.textContent = H.name;
    setTimeout(() => inp.focus(), 30);
    return;
  }
  hint.textContent = H.next;
  if (step.fx === 'heartbeat') heartbeat();
  if (step.fx === 'boot') bootChime();
  cineType(fmt(step.text), step.k === 'title' ? 40 : 26, step.k === 'ora');
}
function introAdvance() {
  if (introSteps()[CI.i].k === 'name') { confirmName(); return; }
  if (CI.typing) { clearInterval(CI.typer); CI.typing = false; $('#cineText').textContent = CI.full; return; }
  CI.i++;
  if (CI.i >= introSteps().length) { closeIntro(); return; }
  showIntroStep();
}
function confirmName() {
  const v = $('#nameInput').value.replace(/[\[\]{}<>]/g, '').trim().slice(0, 16);
  S.name = v || INTRO_HINT[S.lang].defName; save();
  $('#nameInput').blur(); sfx.unlock();
  CI.i++; showIntroStep();
}
function closeIntro() {
  clearInterval(CI.typer); CI.typing = false;
  if (!S.name) { S.name = INTRO_HINT[S.lang].defName; save(); }
  const el = $('#cinema'); el.classList.add('gone');
  setTimeout(() => { el.hidden = true; }, 900);
  startLevel(firstOpen());
}
function resizeCine() {
  const cv = $('#cineStars'), r = cv.getBoundingClientRect();
  CI.cv = cv; CI.ctx = cv.getContext('2d'); CI.w = r.width; CI.h = r.height;
  cv.width = Math.round(r.width); cv.height = Math.round(r.height);
  CI.stars = Array.from({ length: 160 }, () => ({ x: Math.random() * CI.w, y: Math.random() * CI.h, z: 0.3 + Math.random() * 1.5 }));
  fit(cineFace, '#cineFace');
}
function drawCine(now) {
  const c = CI.ctx; if (!c || !CI.w) return;
  c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, 0, CI.w, CI.h);
  CI.stars.forEach(s => {
    s.x -= s.z * 0.25; if (s.x < 0) { s.x = CI.w; s.y = Math.random() * CI.h; }
    c.fillStyle = `rgba(210,228,255,${0.3 + 0.5 * (s.z / 1.8)})`; c.fillRect(s.x, s.y, s.z, s.z);
  });
  const step = introSteps()[CI.i];
  if (step && (step.k === 'ora' || step.k === 'name')) drawFace(cineFace, now, 'ora', CI.typing, true);
}
$('#cineSkip').onclick = (e) => { e.currentTarget.blur(); initAudio(); closeIntro(); };
$('#introBtn').onclick = (e) => { e.currentTarget.blur(); initAudio(); openIntro(); };
$('#nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); initAudio(); confirmName(); }
});

/* ---------- Input ---------- */
const MODS = ['ShiftLeft','ShiftRight','ControlLeft','ControlRight','AltLeft','AltRight','MetaLeft','MetaRight','CapsLock'];
function shakeLine() { const tl = $('#termLine'); if (tl) { tl.classList.remove('shake'); void tl.offsetWidth; tl.classList.add('shake'); } }

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.phase === 'intro') {
    if (e.target && e.target.id === 'nameInput') return;
    if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (e.repeat) return; initAudio(); introAdvance(); }
    return;
  }
  initAudio();
  const kEl = document.getElementById('k-' + e.code);
  if (kEl) kEl.classList.add('pressed');

  if (e.code === 'Tab') {
    e.preventDefault();
    if (S.phase === 'drill') { S.ch = 0; S.msg = ''; renderTerminal(); renderKeyboard(); }
    return;
  }
  if (S.phase === 'dialogue' || S.phase === 'complete' || S.phase === 'ending') {
    if (e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (S.phase === 'dialogue') advanceDialogue();
      else if (S.phase === 'complete') nextLevel();
      else if (S.ending === 1) startLevel(ACTS[1].from);
    }
    return;
  }
  if (MODS.includes(e.code) || e.repeat) return;
  if (KEY[e.code] || e.code === 'Space') e.preventDefault();

  const expected = expectedChar();
  if (expected == null) return;
  if (S.phase === 'combat' && e.code === 'Space') return;   // habit-space between words is harmless in combat

  const mapped = charOf(e.code);
  const ok = mapped === expected || (e.key && e.key.toLowerCase() === expected);
  if (!S.startT) S.startT = performance.now();
  S.total++;

  if (ok) {
    S.correct++; S.msg = '';
    const now = performance.now(), dt = now - S.lastKey; S.lastKey = now;
    const inst = dt < 1500 ? Math.min(1.6, (1000 / dt) / 4) : 0.15;
    S.cadence = S.cadence * 0.65 + inst * 0.35;

    if (S.phase === 'drill') {
      sfx.key();
      if (S.lvl < ACTS[1].from) view.pulses.push({ t: now, i: S.lvl });
      const line = curLine();
      S.ch++;
      if (S.ch >= line.text.length) {
        S.lineIdx++; S.ch = 0;
        if (S.lineIdx >= S.lines.length) { S.lineIdx = S.lines.length - 1; S.ch = line.text.length; drillFinished(); return; }
        lineRemark();
      }
    } else if (S.phase === 'decrypt') {
      sfx.key();
      const d = S.dec, k = d.keys[d.ki];
      d.ch++;
      if (d.ch >= k.k.length) {
        k.open = true; d.ki++; d.ch = 0; sfx.reveal();
        if (d.ki >= d.keys.length) { decryptDone(); return; }
      }
      renderCrtText();
    } else if (S.phase === 'combat') {
      sfx.laser();
      const s = C.ships[0];
      C.typed++; s.hit = 90;
      C.lasers.push({ x: s.x, y: s.y, t: now, off: (C.typed % 2 ? -8 : 8) });
      if (C.typed >= s.word.length) {
        C.ships.shift(); C.typed = 0;
        C.booms.push({ x: s.x, y: s.y, t: now, r: Math.random() });
        sfx.boom();
      }
    }
  } else {
    sfx.err();
    S.cadence *= 0.5;
    const pressedOnline = onlineKeys().has(e.code);
    S.msg = pressedOnline || !KEY[e.code] ? t('wrongKey') : t('offKey');
    if (kEl) { kEl.classList.add('wrong'); setTimeout(() => kEl.classList.remove('wrong'), 220); }
  }
  renderTerminal(); renderKeyboard(); renderSystems(); renderStats();
  if (!ok) shakeLine();
});
window.addEventListener('keyup', (e) => {
  const el = document.getElementById('k-' + e.code); if (el) el.classList.remove('pressed');
});

function firstOpen(from = 0, to = N - 1) { for (let i = from; i <= to; i++) if (!S.done[S.lang][i]) return i; return from; }
$('#langEN').onclick = (e) => { e.currentTarget.blur(); if (S.phase === 'intro') { S.lang = 'en'; save(); renderChrome(); showIntroStep(); return; } if (S.lang !== 'en') { S.lang = 'en'; save(); const a = ACTS[actOf(S.lvl)]; startLevel(firstOpen(a.from, a.to)); } };
$('#langUK').onclick = (e) => { e.currentTarget.blur(); if (S.phase === 'intro') { S.lang = 'uk'; save(); renderChrome(); showIntroStep(); return; } if (S.lang !== 'uk') { S.lang = 'uk'; save(); const a = ACTS[actOf(S.lvl)]; startLevel(firstOpen(a.from, a.to)); } };
$('#act1').onclick = (e) => { e.currentTarget.blur(); initAudio(); startLevel(firstOpen(ACTS[0].from, ACTS[0].to)); };
$('#act2').onclick = (e) => { e.currentTarget.blur(); initAudio(); startLevel(firstOpen(ACTS[1].from, ACTS[1].to)); };
$('#soundBtn').onclick = (e) => {
  e.currentTarget.blur(); initAudio();
  S.sound = !S.sound; if (master) master.gain.value = S.sound ? 0.9 : 0; renderChrome();
};

/* ---------- Canvas sizing + loop ---------- */
function fit(obj, sel) {
  const cv = $(sel), r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  obj.cv = cv; obj.ctx = cv.getContext('2d'); obj.w = r.width; obj.h = r.height;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  obj.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function resize() { fit(view, '#view'); fit(face, '#face'); initStars(); if (S.phase === 'intro') resizeCine(); }
window.addEventListener('resize', resize);
if (window.ResizeObserver) { const ro = new ResizeObserver(() => resize()); ro.observe($('#view')); ro.observe($('#face')); }

let lastNow = performance.now(), lastNoise = 0, lastSig = 0;
function loop(now) {
  const dt = Math.min(50, now - lastNow); lastNow = now;
  if (now - S.lastKey > 900) S.cadence *= 0.985;
  if (view.shake > 0) view.shake -= dt;

  if (S.phase === 'decrypt' && S.dec) {
    S.dec.left -= dt;
    if (now - lastNoise > 110) { lastNoise = now; renderCrtText(); }
    if (now - lastSig > 200) {
      lastSig = now;
      const bar = $('#sigBar');
      if (bar) { const sig = Math.max(0, S.dec.left / S.dec.total); bar.firstElementChild.style.width = (sig * 100).toFixed(1) + '%'; bar.classList.toggle('low', sig < 0.3); }
    }
    if (S.dec.left <= 0) signalLost();
  }
  if (S.phase === 'combat') combatTick(now, dt);

  const target = targetPowers();
  for (let i = 0; i < 5; i++) view.pw[i] += (target[i] - view.pw[i]) * 0.05;
  drawView(now, view.pw);
  drawFace(face, now, S.phase === 'decrypt' ? 'unknown' : S.speaker, S.speaking, false);
  if (S.phase === 'intro') drawCine(now);
  updateAudio(now, view.pw);
  requestAnimationFrame(loop);
}

load();
buildKeyboard();
resize();
renderChrome();
if (!S.name) openIntro(); else startLevel(firstOpen());
requestAnimationFrame(loop);
</script>
</body>
</html>
