<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KeyQuest Cold Boot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: the ship's bridge, fitted to one screen.
   Row 1: cockpit window + systems bulkhead. Row 2: comms console (ORA's face, her words, your typing line). Row 3: keyboard deck. */
:root {
  --hull: #080b0e;
  --plate: #111820;
  --plate-2: #0c1218;
  --seam: #212c37;
  --rivet: #2c3946;
  --text: #d6e0e7;
  --muted: #74838f;
  --dim: #34414c;
  --phos: #ffb547;
  --live: #6ff0a8;
  --alert: #ff5a52;
  --hazard: #d99a26;
  --f-display: "Chakra Petch", "Rajdhani", "Segoe UI", sans-serif;
  --f-crt: "VT323", "Courier New", monospace;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--f-mono); color: var(--text); -webkit-font-smoothing: antialiased; user-select: none;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 180px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 140px),
    var(--hull);
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--phos); outline-offset: 2px; }

.app {
  height: 100%; max-width: 1320px; margin: 0 auto;
  display: grid; grid-template-rows: auto minmax(120px, 1fr) auto auto; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (max-width: 820px), (max-height: 600px) { .app { height: auto; grid-template-rows: auto; } .viewport { height: 200px; } }

/* ---------- Hull plates ---------- */
.plate {
  position: relative; border-radius: 10px;
  background: linear-gradient(180deg, var(--plate), var(--plate-2));
  border: 1px solid var(--seam);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 -2px 0 rgba(0,0,0,.45), 0 8px 20px rgba(0,0,0,.35);
}
.plate::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background:
    radial-gradient(circle at 9px 9px, var(--rivet) 2px, transparent 2.6px),
    radial-gradient(circle at calc(100% - 9px) 9px, var(--rivet) 2px, transparent 2.6px),
    radial-gradient(circle at 9px calc(100% - 9px), var(--rivet) 2px, transparent 2.6px),
    radial-gradient(circle at calc(100% - 9px) calc(100% - 9px), var(--rivet) 2px, transparent 2.6px);
}
.tag {
  font-family: var(--f-display); font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
  color: var(--muted); background: #0a0f14; border: 1px solid var(--seam); border-radius: 3px; padding: 2px 7px;
}
.label { font-family: var(--f-display); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

/* ---------- Ceiling bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 16px 8px 22px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .16em; }
.brand .act { font-family: var(--f-display); font-size: 12px; letter-spacing: .18em; color: var(--phos); }
.leds { display: flex; gap: 5px; }
.leds i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.leds i.on { background: var(--live); box-shadow: 0 0 6px var(--live); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--seam); border-radius: 6px; overflow: hidden; background: #0a0f14; }
.seg button { background: transparent; border: 0; padding: 6px 12px; font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; color: var(--muted); cursor: pointer; }
.seg button.on { background: #18212a; color: var(--text); box-shadow: inset 0 -2px 0 var(--phos); }
.btn { background: #0a0f14; border: 1px solid var(--seam); border-radius: 6px; padding: 6px 12px; font-family: var(--f-display); font-size: 12px; letter-spacing: .1em; color: var(--muted); cursor: pointer; }
.btn:hover { color: var(--text); }
.readout { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
.readout div { display: grid; text-align: right; }
.readout span { font-family: var(--f-display); font-size: 10px; letter-spacing: .16em; color: var(--muted); }
.readout b { font-size: 16px; font-weight: 600; }

/* ---------- Bridge: window + systems ---------- */
.bridge { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 10px; min-height: 0; }
@media (max-width: 820px) { .bridge { grid-template-columns: 1fr; } }
.viewport { position: relative; min-height: 0; height: 100%; padding: 8px; }
.viewport canvas { display: block; width: 100%; height: 100%; border-radius: 6px; }
.viewport .tag { position: absolute; left: 22px; bottom: 14px; z-index: 1; }
.systems { padding: 12px; display: grid; gap: 4px; align-content: start; min-height: 0; overflow: auto; }
.systems .tag { justify-self: start; margin-bottom: 4px; }
.sys { display: grid; grid-template-columns: 8px 1fr auto auto; align-items: center; gap: 9px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 6px 7px; cursor: pointer; }
.sys:hover { background: #151d25; }
.sys.current { border-color: var(--seam); background: #151d25; }
.sys .led { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.sys.online .led { background: var(--live); box-shadow: 0 0 8px var(--live); }
.sys.booting .led { background: var(--phos); box-shadow: 0 0 8px var(--phos); animation: blink 1s steps(1) infinite; }
.sys .nm { font-family: var(--f-display); font-size: 13px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sys .keys { font-size: 10px; color: var(--dim); }
.sys .st { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: right; }
.sys.online .st { color: var(--live); }

/* ---------- Comms console (centre of attention) ---------- */
.comms { --tint: var(--phos); display: grid; grid-template-columns: clamp(150px, 19vw, 240px) minmax(0, 1fr); gap: 10px; padding: 12px; }
.comms.enemy { --tint: var(--alert); }
@media (max-width: 820px) { .comms { grid-template-columns: 1fr; } }
.screen {
  position: relative; overflow: hidden; border-radius: 14px / 18px;
  background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--tint) 9%, #0a0805) 0%, #040302 80%);
  box-shadow: inset 0 0 40px rgba(0,0,0,.9), inset 0 0 0 2px #000, 0 0 0 3px #1a2129;
}
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.26) 0 1px, transparent 1px 3px); }
.face-screen { display: grid; grid-template-rows: auto 1fr; min-height: 190px; }
.face-screen .label { padding: 10px 12px 0; color: color-mix(in srgb, var(--tint) 75%, var(--muted)); display: flex; justify-content: space-between; gap: 8px; font-size: 10px; }
.face-screen canvas { width: 100%; height: 100%; display: block; min-height: 150px; }
.log-screen { display: grid; grid-template-rows: auto auto; align-content: start; gap: 6px; padding: 14px 20px 14px; min-height: 190px; }
.crt-text { font-family: var(--f-crt); font-size: clamp(25px, 2.5vw, 34px); line-height: 1.08; color: var(--tint); text-shadow: 0 0 8px color-mix(in srgb, var(--tint) 65%, transparent); min-height: 2.3em; }
.crt-text .who { opacity: .55; margin-right: .4em; }
.crt-text .caret { animation: blink 1s steps(1) infinite; }
.comms.enemy .crt-text { animation: jitter .18s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes jitter { 50% { transform: translateX(1px); } }

.terminal { border-top: 1px dashed color-mix(in srgb, var(--tint) 30%, transparent); padding-top: 10px; display: grid; gap: 8px; }
.term-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.term-head .kind { color: var(--tint); }
.term-line { font-family: var(--f-mono); font-weight: 500; font-size: clamp(24px, 3.2vw, 38px); letter-spacing: .06em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 2px; min-height: 1.3em; }
.term-line .prompt { color: var(--dim); margin-right: 14px; }
.c { color: #8b9aa6; padding: 0 1px; border-bottom: 3px solid transparent; }
.c.ok { color: var(--live); }
.c.cur { color: #fff; border-bottom-color: var(--cur, var(--phos)); background: color-mix(in srgb, var(--cur, var(--phos)) 20%, transparent); animation: pulse 1.2s ease-in-out infinite; }
.c.sp { color: var(--dim); font-size: .6em; }
.c.sp.ok { color: color-mix(in srgb, var(--live) 50%, var(--dim)); }
@keyframes pulse { 50% { background: color-mix(in srgb, var(--cur, var(--phos)) 34%, transparent); } }
.term-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.term-foot .msg { color: var(--alert); }
.term-foot .finger b { color: var(--text); font-weight: 600; }
.shake { animation: shake .26s; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
.waiting { font-size: 15px; color: var(--muted); }
kbd { font-family: var(--f-mono); border: 1px solid var(--seam); border-bottom-width: 3px; border-radius: 5px; padding: 1px 8px; color: var(--text); background: #0d1318; }
.done { display: grid; gap: 8px; }
.done h3 { margin: 0; font-family: var(--f-display); font-size: 24px; letter-spacing: .12em; color: var(--live); }
.done .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 26px; font-variant-numeric: tabular-nums; }
.done .stars { color: var(--phos); font-size: 22px; letter-spacing: .3em; }
.done .row b { font-size: 20px; font-weight: 600; margin-left: 6px; }
.done .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.done.enc h3 { color: var(--alert); }
.progress { height: 4px; background: #151d25; border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--live); transition: width .25s; }

/* ---------- Keyboard deck ---------- */
.deck { padding: 16px 14px 12px; display: grid; gap: 8px; overflow: hidden; }
.deck::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; border-radius: 10px 10px 0 0; opacity: .75;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 9px, #0c1116 9px 18px); }
.deck-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.kb-scroll { overflow-x: auto; }
.kb { display: grid; gap: 5px; min-width: 560px; }
.kr { display: flex; gap: 5px; }
.key { --fc: var(--dim); flex: var(--u) 1 0; min-width: 0; height: clamp(28px, 4.6vh, 46px); border-radius: 7px; position: relative;
  display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 15px; font-weight: 500;
  background: #0b1015; border: 1px solid #161e26; color: #26313b; transition: background .15s, box-shadow .15s, color .15s, transform .06s; }
.key.mod { font-size: 11px; font-family: var(--f-display); letter-spacing: .08em; }
.key.gap { visibility: hidden; }
.key.on { background: linear-gradient(#1a232c, #131a21); border-color: #26313c; color: var(--text); box-shadow: inset 0 -3px 0 var(--fc), 0 2px 0 #04070a; }
.key.target { background: color-mix(in srgb, var(--fc) 34%, #131a21); color: #fff; box-shadow: 0 0 0 2px var(--fc), 0 0 22px color-mix(in srgb, var(--fc) 70%, transparent); z-index: 1; }
.key.pressed { transform: translateY(2px); }
.key.wrong { background: #4a1a1c; box-shadow: 0 0 0 2px var(--alert); color: #fff; }
.key.bump::after { content: ""; position: absolute; bottom: 6px; width: 10px; height: 2px; border-radius: 1px; background: currentColor; opacity: .7; }
.key.powering { animation: powerUp 1.3s ease-out; }
@keyframes powerUp { 0% { background: #0b1015; color: #26313b; } 20% { background: var(--fc); color: #000; } 35% { background: #0b1015; } 50% { background: var(--fc); color: #000; box-shadow: 0 0 26px var(--fc); } 100% { } }
.fingers { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.fp { --fc: var(--dim); font-family: var(--f-display); font-size: 10px; letter-spacing: .12em; padding: 4px 8px; border-radius: 999px; border: 1px solid #1a232c; color: var(--muted); }
.fp i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--fc); margin-right: 6px; vertical-align: 1px; opacity: .55; }
.fp.active { border-color: var(--fc); color: #fff; background: color-mix(in srgb, var(--fc) 22%, transparent); }
.fp.active i { opacity: 1; box-shadow: 0 0 8px var(--fc); }
.fp.split { margin-right: 16px; }

@media (prefers-reduced-motion: reduce) {
  .c.cur, .key.powering, .sys.booting .led, .comms.enemy .crt-text, .shake { animation: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top plate">
    <div class="brand"><h1>KEYQUEST</h1><span class="act" id="actLabel">ACT 1 · COLD BOOT</span><span class="leds" id="leds"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button id="langEN" class="on">EN · QWERTY</button>
        <button id="langUK">UA · ЙЦУКЕН</button>
      </div>
      <button class="btn" id="soundBtn">SOUND ON</button>
    </div>
    <div class="readout">
      <div><span>WPM</span><b id="rWpm">0</b></div>
      <div><span>ACC</span><b id="rAcc">100%</b></div>
    </div>
  </header>

  <section class="bridge">
    <div class="viewport plate"><canvas id="view"></canvas><span class="tag">Bridge · Forward view</span></div>
    <div class="systems plate" id="systems"></div>
  </section>

  <section class="comms plate" id="comms">
    <div class="screen face-screen">
      <div class="label"><span id="crtName">ORA · SHIP AI</span><span id="crtChan">CH 01</span></div>
      <canvas id="face"></canvas>
    </div>
    <div class="screen log-screen">
      <div class="crt-text" id="crtText"></div>
      <div class="terminal" id="terminal"></div>
    </div>
  </section>

  <section class="deck plate">
    <div class="deck-head">
      <span class="tag" id="deckLabel">Control deck</span>
      <span class="label" id="deckHint">Space continues · Tab restarts the line</span>
    </div>
    <div class="kb-scroll"><div class="kb" id="kb"></div></div>
    <div class="fingers" id="fingers"></div>
  </section>
</div>

<script>
/* ======================================================================
   KEYQUEST · ACT 1 · COLD BOOT
   Story: the player wakes aboard a dark ship. ORA, the ship AI, guides
   them through booting 5 systems. Each system = one typing lesson that
   powers on new keys. Typing is the only way anything happens.
   ====================================================================== */

/* ---------- Physical keyboard: [code, finger, width units, en, uk, label] ---------- */
const ROWS = [
  [['Backquote','lp',1,'`',"'"],['Digit1','lp',1,'1','1'],['Digit2','lr',1,'2','2'],['Digit3','lm',1,'3','3'],['Digit4','li',1,'4','4'],['Digit5','li',1,'5','5'],['Digit6','ri',1,'6','6'],['Digit7','ri',1,'7','7'],['Digit8','rm',1,'8','8'],['Digit9','rr',1,'9','9'],['Digit0','rp',1,'0','0'],['Minus','rp',1,'-','-'],['Equal','rp',1,'=','='],['Backspace','rp',2,null,null,'⌫']],
  [['Tab','lp',1.5,null,null,'TAB'],['KeyQ','lp',1,'q','й'],['KeyW','lr',1,'w','ц'],['KeyE','lm',1,'e','у'],['KeyR','li',1,'r','к'],['KeyT','li',1,'t','е'],['KeyY','ri',1,'y','н'],['KeyU','ri',1,'u','г'],['KeyI','rm',1,'i','ш'],['KeyO','rr',1,'o','щ'],['KeyP','rp',1,'p','з'],['BracketLeft','rp',1,'[','х'],['BracketRight','rp',1,']','ї'],['Backslash','rp',1.5,'\\','ґ']],
  [['CapsLock','lp',1.75,null,null,'CAPS'],['KeyA','lp',1,'a','ф'],['KeyS','lr',1,'s','і'],['KeyD','lm',1,'d','в'],['KeyF','li',1,'f','а'],['KeyG','li',1,'g','п'],['KeyH','ri',1,'h','р'],['KeyJ','ri',1,'j','о'],['KeyK','rm',1,'k','л'],['KeyL','rr',1,'l','д'],['Semicolon','rp',1,';','ж'],['Quote','rp',1,"'",'є'],['Enter','rp',2.25,null,null,'ENTER']],
  [['ShiftLeft','lp',2.25,null,null,'SHIFT'],['KeyZ','lp',1,'z','я'],['KeyX','lr',1,'x','ч'],['KeyC','lm',1,'c','с'],['KeyV','li',1,'v','м'],['KeyB','li',1,'b','и'],['KeyN','ri',1,'n','т'],['KeyM','ri',1,'m','ь'],['Comma','rm',1,',','б'],['Period','rr',1,'.','ю'],['Slash','rp',1,'/','.'],['ShiftRight','rp',2.75,null,null,'SHIFT']],
  [['_gapL','th',4],['Space','th',7,' ',' ','SPACE'],['_gapR','th',4]]
];
const KEY = {};
ROWS.flat().forEach(([code, finger, u, en, uk, label]) => { KEY[code] = { code, finger, u, en, uk, label }; });
const BUMPS = new Set(['KeyF', 'KeyJ']);

const FINGER_COLOR = { lp:'#ec4899', lr:'#f97316', lm:'#eab308', li:'#22c55e', th:'#818cf8', ri:'#22d3ee', rm:'#3b82f6', rr:'#a78bfa', rp:'#e879f9' };
const FINGER_NAME = {
  en: { lp:'Left pinky', lr:'Left ring', lm:'Left middle', li:'Left index', th:'Either thumb', ri:'Right index', rm:'Right middle', rr:'Right ring', rp:'Right pinky' },
  uk: { lp:'Лівий мізинець', lr:'Лівий безіменний', lm:'Лівий середній', li:'Лівий вказівний', th:'Великий палець', ri:'Правий вказівний', rm:'Правий середній', rr:'Правий безіменний', rp:'Правий мізинець' }
};
const FINGER_SHORT = {
  en: { lp:'L PINKY', lr:'L RING', lm:'L MID', li:'L INDEX', th:'THUMBS', ri:'R INDEX', rm:'R MID', rr:'R RING', rp:'R PINKY' },
  uk: { lp:'Л МІЗ', lr:'Л БЕЗІМ', lm:'Л СЕР', li:'Л ВКАЗ', th:'ВЕЛИКІ', ri:'П ВКАЗ', rm:'П СЕР', rr:'П БЕЗІМ', rp:'П МІЗ' }
};

/* ---------- UI strings ---------- */
const T = {
  en: { act:'ACT 1 · COLD BOOT', deck:'Control deck', tabHint:'Space continues · Tab restarts the line', spaceKey:'Space ␣', locate:'LOCATE KEY', boot:'BOOT SEQUENCE', step:'Step',
        next:'Next', online:'ONLINE', offline:'OFFLINE', booting:'BOOTING', acc:'Accuracy', wpm:'WPM', cont:'to continue', nextSys:'next system',
        find:'Find', lastOne:'Last line. Enter the code.', offKey:'That key is still offline.', wrongKey:'Not that one.', use:'Use',
        incoming:'Message from ORA', oraName:'ORA · SHIP AI', unknown:'UNKNOWN SIGNAL', encrypted:'TRANSMISSION ENCRYPTED',
        decOff:'The decryption module needs more keys. That comes next.', act2:'ACT 2 · FIRST CONTACT — next build', replay:'Replay Act 1', reset:'Reset progress',
        space:'SPACE', sound:['SOUND ON','SOUND OFF'], systems:'Ship systems', keys:'Keys' },
  uk: { act:'ДІЯ 1 · ХОЛОДНИЙ СТАРТ', deck:'Пульт керування', tabHint:'Пробіл — далі · Tab — рядок заново', spaceKey:'Пробіл ␣', locate:'ЗНАЙДИ КЛАВІШУ', boot:'ПОСЛІДОВНІСТЬ ЗАПУСКУ', step:'Крок',
        next:'Далі', online:'ПРАЦЮЄ', offline:'ВИМКНЕНО', booting:'ЗАПУСК', acc:'Точність', wpm:'Слів/хв', cont:'щоб продовжити', nextSys:'наступна система',
        find:'Знайди', lastOne:'Останній рядок. Введи код.', offKey:'Ця клавіша ще вимкнена.', wrongKey:'Не та клавіша.', use:'Використай',
        incoming:'Повідомлення від ОРИ', oraName:'ОРА · БОРТОВИЙ ШІ', unknown:'НЕВІДОМИЙ СИГНАЛ', encrypted:'ПЕРЕДАЧА ЗАШИФРОВАНА',
        decOff:'Модулю дешифрування потрібно більше клавіш. Це далі.', act2:'ДІЯ 2 · ПЕРШИЙ КОНТАКТ — у наступній версії', replay:'Пройти знову', reset:'Скинути прогрес',
        space:'ПРОБІЛ', sound:['ЗВУК УВІМК','ЗВУК ВИМК'], systems:'Системи корабля', keys:'Клавіші' }
};

/* ---------- ACT 1 curriculum: 5 systems ---------- */
const LEVELS = [
  { sys:{ en:'Reactor', uk:'Реактор' }, newKeys:['KeyF','KeyJ'], codeLabel:{ en:'IGNITION CODE', uk:'КОД ЗАПУСКУ' },
    en:{ intro:['...power at 2%. Hello? Engineer, you are awake. Good.', 'I am ORA, this ship\'s computer. Most of me is offline.', 'The reactor needs an ignition code. Rest your index fingers on F and J. Feel the bumps?'],

  en: ['...#%@ ENGINEER %&... YOU... SHOULD NOT... H@VE... WOKEN... THIS SHIP...', '...&&#... TURN BACK... OR... #%@&*...'],

/* ---------- State ---------- */
const S = {
  lang: 'en', lvl: 0, phase: 'dialogue',     // dialogue | drill | complete | finale
  lines: [], lineIdx: 0, ch: 0,
  levelDone: false, finale: false, crtMode: 'ora',
  correct: 0, total: 0, startT: null, lastStars: 0, lastWpm: 0, lastAcc: 100,
  msg: '', done: { en: [0,0,0,0,0], uk: [0,0,0,0,0] },
  sound: true, cadence: 0, lastKey: 0,
  dlg: [], dlgIdx: 0, dlgCb: null, full: '', shown: '', speaking: false, typer: null, blocking: false
};

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const t = (k) => T[S.lang][k];
const L = () => LEVELS[S.lvl];
const LT = () => LEVELS[S.lvl][S.lang];

function charOf(code, lang = S.lang) {
  if (code === 'Space') return ' ';
  return KEY[code] ? KEY[code][lang] : null;
}
function codeOf(ch, lang = S.lang) {
  if (ch === ' ') return 'Space';
  for (const c in KEY) if (KEY[c][lang] === ch) return c;
  return null;
}
function keyLabel(code) { return code === 'Space' ? t('space') : (charOf(code) || '').toUpperCase(); }

/* ---------- Save ---------- */
function save() { try { localStorage.setItem('keyquest.act1', JSON.stringify({ done: S.done, lang: S.lang })); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('keyquest.act1') || 'null');
    if (d && d.done) { S.done = { en: d.done.en || [0,0,0,0,0], uk: d.done.uk || [0,0,0,0,0] }; S.lang = d.lang === 'uk' ? 'uk' : 'en'; }
  } catch (e) {}
}

/* ---------- Which keys are powered ---------- */
function onlineKeys() {
  const set = new Set();
  LEVELS.forEach((lv, i) => {
    const live = i < S.lvl || S.done[S.lang][i] || S.finale || (i === S.lvl && (S.phase !== 'dialogue' || S.levelDone));
    if (live) lv.newKeys.forEach(k => set.add(k));
  });
  return set;
}
function curLine() { return S.lines[S.lineIdx]; }
function expectedCode() {
  if (S.phase !== 'drill') return null;
  const line = curLine(); if (!line) return null;
  return codeOf(line.text[S.ch]);
}
function liveProgress() {
  if (S.levelDone) return 1;
  if (S.phase !== 'drill' || !S.lines.length) return 0;
  const line = curLine();
  return (S.lineIdx + (line ? S.ch / line.text.length : 0)) / S.lines.length;
}
function targetPowers() {
  if (S.finale) return [1,1,1,1,1];
  return [0,1,2,3,4].map(i => S.done[S.lang][i] || i < S.lvl ? 1 : (i === S.lvl ? liveProgress() : 0));
}

/* ======================================================================
   AUDIO: key clicks, error buzz, unlock chime + reactor hum whose pitch
   follows your typing cadence (the "engine output").
   ====================================================================== */
let AC = null, master = null, hum = null, nextPulse = 0;
function initAudio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AC = new C(); master = AC.createGain(); master.gain.value = S.sound ? 0.9 : 0; master.connect(AC.destination);
    const o1 = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o1.type = 'sawtooth'; o1.frequency.value = 55; o2.type = 'sine'; o2.frequency.value = 110;
    f.type = 'lowpass'; f.frequency.value = 160; g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(master); o1.start(); o2.start();
    hum = { o1, o2, f, g };
  }
  if (AC.state === 'suspended') AC.resume();
}
function blip(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || !S.sound) return;
  const tt = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, tt); if (f1) o.frequency.exponentialRampToValueAtTime(f1, tt + dur);
  g.gain.setValueAtTime(vol, tt); g.gain.exponentialRampToValueAtTime(0.0008, tt + dur);
  o.connect(g); g.connect(master); o.start(tt); o.stop(tt + dur + 0.03);
}
const sfx = {
  key: () => blip('triangle', 900 + Math.random() * 80, 620, 0.04, 0.05),
  err: () => blip('sawtooth', 140, 70, 0.16, 0.08),
  talk: () => blip('square', S.crtMode === 'enemy' ? 90 + Math.random() * 60 : 320 + Math.random() * 160, null, 0.025, 0.01),
  unlock: () => { blip('sine', 523, null, 0.12, 0.07); blip('sine', 784, null, 0.2, 0.07, 0.11); },
  online: () => [392, 494, 587, 784].forEach((f, i) => blip('triangle', f, null, 0.55, 0.05, i * 0.07)),
  glitch: () => { for (let i = 0; i < 7; i++) blip('sawtooth', 70 + Math.random() * 700, 40, 0.09, 0.04, i * 0.06); }
};
function updateAudio(now, pw) {
  if (!AC || !hum) return;
  const at = AC.currentTime;
  hum.g.gain.setTargetAtTime(S.sound ? 0.03 * (0.15 + 0.85 * pw[0]) : 0, at, 0.3);
  hum.o1.frequency.setTargetAtTime(50 + pw[0] * 5 + S.cadence * 12, at, 0.25);
  hum.o2.frequency.setTargetAtTime(100 + pw[0] * 10 + S.cadence * 24, at, 0.25);
  hum.f.frequency.setTargetAtTime(150 + pw[2] * 220 + S.cadence * 520, at, 0.2);
  // engine pulse: speeds up with your rhythm once thrusters are lit
  if (pw[2] > 0.95 && S.cadence > 0.15 && now > nextPulse) {
    blip('sine', 165 + S.cadence * 60, 110, 0.08, 0.03);
    nextPulse = now + Math.max(160, 620 - S.cadence * 380);
  }
}

/* ======================================================================
   CRT: typewriter dialogue + pixel-art face
   ====================================================================== */
function typeText(text, blocking, cb) {
  clearInterval(S.typer);
  S.full = text; S.shown = ''; S.speaking = true; S.blocking = blocking; S.typeCb = cb || null;
  let i = 0;
  S.typer = setInterval(() => {
    i++; S.shown = S.full.slice(0, i);
    if (i % 2 === 0) sfx.talk();
    renderCrtText();
    if (i >= S.full.length) finishTyping();
  }, 24);
  renderCrtText();
}
function finishTyping() {
  clearInterval(S.typer); S.typer = null;
  S.shown = S.full; S.speaking = false; renderCrtText();
  if (S.typeCb) { const cb = S.typeCb; S.typeCb = null; cb(); }
}
function say(lines, cb) {
  S.phase = 'dialogue'; S.dlg = lines; S.dlgIdx = 0; S.dlgCb = cb;
  typeText(lines[0], true);
  renderAll();
}
function advanceDialogue() {
  if (S.speaking) { finishTyping(); return; }
  S.dlgIdx++;
  if (S.dlgIdx < S.dlg.length) { typeText(S.dlg[S.dlgIdx], true); renderTerminal(); }
  else { const cb = S.dlgCb; S.dlgCb = null; if (cb) cb(); }
}
function remark(text) { typeText(text, false); }

function renderCrtText() {
  const el = $('#crtText');
  const showCaret = S.speaking || (S.blocking && S.phase === 'dialogue');
  el.innerHTML = `<span class="who">${S.crtMode === 'enemy' ? '??' : 'ORA'}&gt;</span>` + esc(S.shown) + (showCaret ? '<span class="caret">▌</span>' : '');
  const crt = $('#comms');
  crt.classList.toggle('enemy', S.crtMode === 'enemy');
  $('#crtName').textContent = S.crtMode === 'enemy' ? t('unknown') : t('oraName');
  $('#crtChan').textContent = S.crtMode === 'enemy' ? 'CH ??' : 'CH 01';
}

const face = { cv: null, ctx: null, w: 0, h: 0 };
function drawFace(now) {
  const c = face.ctx, W = face.w, H = face.h; if (!c || !W) return;
  c.clearRect(0, 0, W, H);
  const enemy = S.crtMode === 'enemy';
  const cols = 20, rows = 16;
  const cell = Math.max(3, Math.floor(Math.min(W / cols, H / rows)));
  const ox = Math.floor((W - cols * cell) / 2), oy = Math.floor((H - rows * cell) / 2);
  const rgb = enemy ? '255,90,82' : '255,181,71';
  const powered = S.finale || S.done[S.lang][0] || S.lvl > 0 || S.phase !== 'dialogue' || S.dlgIdx > 0;
  const flick = powered ? 1 : (0.55 + 0.45 * Math.random());
  c.shadowColor = `rgba(${rgb},.8)`; c.shadowBlur = cell * 0.9;

  const inside = enemy
    ? (x, y) => {
        if (y < 1 || y > 15) return false;
        const hw = y < 5 ? 2.5 + y * 1.4 : (y < 11 ? 9.5 : 9.5 - (y - 10) * 1.5);
        return Math.abs(x - 9.5) <= hw;
      }
    : (x, y) => { const dx = (x - 9.5) / 8.4, dy = (y - 7.8) / 7.3; return dx * dx + dy * dy < 1; };
  const px = (x, y, a) => { c.fillStyle = `rgba(${rgb},${a * flick})`; c.fillRect(ox + x * cell, oy + y * cell, cell - 1, cell - 1); };

  const glitchRow = enemy && Math.random() < 0.3 ? (Math.random() * rows) | 0 : -1;
  for (let y = 0; y < rows; y++) {
    const shift = y === glitchRow ? ((Math.random() * 3) | 0) - 1 : 0;
    for (let x = 0; x < cols; x++) {
      if (!inside(x, y)) continue;
      const edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
      px(x + shift, y, edge ? 0.95 : 0.13);
    }
  }
  const speakFrame = S.speaking && Math.floor(now / 90) % 2 === 0;
  if (!enemy) {
    const blink = now % 4200 < 130;
    for (const ex of [6, 12]) { px(ex, 7, 1); px(ex + 1, 7, 1); if (!blink) { px(ex, 6, 1); px(ex + 1, 6, 1); } }
    if (speakFrame) { for (let x = 8; x <= 11; x++) { px(x, 10, 1); px(x, 12, 1); } px(8, 11, 1); px(11, 11, 1); }
    else for (let x = 8; x <= 11; x++) px(x, 11, 1);
    for (let y = 6; y <= 9; y++) { px(0, y, 0.7); px(19, y, 0.7); }   // sensor "ears"
  } else {
    for (let x = 4; x <= 15; x++) px(x, 6, 0.95);
    const scan = 4 + Math.floor(now / 70) % 12; px(scan, 7, 1); px(Math.min(15, scan + 1), 7, 0.6);
    for (let x = 6; x <= 13; x++) if ((x + (speakFrame ? 1 : 0)) % 2) { px(x, 11, 0.9); px(x, 12, 0.6); }
    for (let i = 0; i < 14; i++) px((Math.random() * cols) | 0, (Math.random() * rows) | 0, 0.25);
  }
  c.shadowBlur = 0;
}

/* ======================================================================
   VIEWPORT: the cockpit window. Each system changes what you see.
   reactor = light, life support = sill lights, thrusters = star motion,
   sensors = radar, navigation = planet + course.
   ====================================================================== */
const view = { cv: null, ctx: null, w: 0, h: 0, stars: [], pw: [0.02, 0, 0, 0, 0] };
function initStars() {
  view.stars = Array.from({ length: 140 }, () => ({ x: Math.random() * view.w, y: Math.random() * view.h, z: 0.4 + Math.random() * 1.6, tw: Math.random() * 6 }));
}
function drawView(now, pw) {
  const ctx = view.ctx, W = view.w, H = view.h; if (!ctx || !W) return;
  ctx.fillStyle = '#02050a'; ctx.fillRect(0, 0, W, H);

  if (pw[0] > 0.05) {
    const g = ctx.createRadialGradient(W * .28, H * .35, 0, W * .28, H * .35, W * .6);
    g.addColorStop(0, `rgba(48,78,120,${0.22 * pw[0]})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // stars
  const speed = pw[2] * (0.35 + S.cadence * 3.2);
  for (const s of view.stars) {
    s.x -= s.z * speed;
    if (s.x < -50) { s.x = W + Math.random() * 30; s.y = Math.random() * H; }
    ctx.globalAlpha = (0.25 + 0.65 * pw[0]) * (0.7 + 0.3 * Math.sin(now * 0.002 + s.tw));
    ctx.fillStyle = '#d5e6ff';
    const streak = s.z * speed * 5;
    if (streak > 3) ctx.fillRect(s.x, s.y, Math.min(60, streak), s.z > 1.4 ? 1.6 : 1);
    else ctx.fillRect(s.x, s.y, s.z, s.z);
  }
  ctx.globalAlpha = 1;

  // navigation: planet + course
  if (pw[4] > 0.01) {
    const px = W * .7, py = H * .45, r = Math.min(W, H) * .22;
    ctx.globalAlpha = pw[4];
    const g = ctx.createRadialGradient(px - r * .4, py - r * .4, r * .1, px, py, r);
    g.addColorStop(0, '#8fdcc8'); g.addColorStop(.55, '#2b6e78'); g.addColorStop(1, '#081620');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(190,235,225,.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(px, py, r * 1.6, r * .32, -.28, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(111,240,168,.75)';
    ctx.beginPath(); ctx.moveTo(W * .5, H * .92); ctx.quadraticCurveTo(W * .52, H * .5, px - r * 1.15, py + r * .2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // sensors: radar with an unknown contact
  if (pw[3] > 0.01) {
    const rx = W * .13, ry = H * .66, r = Math.min(W, H) * .15;
    ctx.globalAlpha = pw[3];
    ctx.strokeStyle = 'rgba(111,240,168,.45)'; ctx.lineWidth = 1;
    for (const k of [1, .66, .33]) { ctx.beginPath(); ctx.arc(rx, ry, r * k, 0, Math.PI * 2); ctx.stroke(); }
    const a = now * 0.0025;
    for (let i = 0; i < 18; i++) {
      ctx.strokeStyle = `rgba(111,240,168,${0.5 * (1 - i / 18)})`;
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + Math.cos(a - i * .03) * r, ry + Math.sin(a - i * .03) * r); ctx.stroke();
    }
    if (pw[3] > 0.98) {
      const bx = rx + Math.cos(-.7) * r * .7, by = ry + Math.sin(-.7) * r * .7;
      ctx.fillStyle = `rgba(255,90,82,${0.5 + 0.5 * Math.sin(now * .008)})`;
      ctx.beginPath(); ctx.arc(bx, by, 3.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // cockpit frame
  const win = [[W * .045, H * .13], [W * .955, H * .13], [W * .985, H * .88], [W * .015, H * .88]];
  ctx.fillStyle = '#0b1015';
  ctx.beginPath(); ctx.rect(0, 0, W, H);
  ctx.moveTo(...win[0]); win.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath();
  ctx.fill('evenodd');
  ctx.strokeStyle = '#1f2a35'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(...win[0]); win.slice(1).forEach(p => ctx.lineTo(...p)); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = '#0b1015'; ctx.fillRect(W / 2 - 3, 0, 6, H * .13 + 6);

  // life support: sill lights
  const n = 20;
  for (let i = 0; i < n; i++) {
    const x = W * .07 + i * (W * .86 / (n - 1)), y = H * .94;
    const lit = (i + 1) / n <= pw[1] + 0.001;
    ctx.fillStyle = lit ? (i % 4 === 0 ? '#ffb547' : '#6ff0a8') : '#18212a';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = lit ? 8 : 0;
    ctx.fillRect(x - 4, y - 1.5, 8, 3);
  }
  ctx.shadowBlur = 0;

  // darkness until the reactor is up
  const dark = 0.8 * (1 - pw[0]);
  if (dark > 0.01) {
    ctx.fillStyle = `rgba(0,0,0,${Math.max(0, dark - (Math.random() < 0.05 ? 0.2 : 0))})`;
    ctx.fillRect(0, 0, W, H);
  }

  // HUD (dim until powered)
  const names = ['PWR', 'O2', 'THR', 'SNS', 'NAV'];
  ctx.font = '600 11px "IBM Plex Mono", monospace'; ctx.textBaseline = 'top';
  let hx = W * .06;
  names.forEach((nm, i) => {
    const v = i === 0 ? Math.max(0.02, pw[0]) : pw[i];
    const txt = `${nm} ${String(Math.round(v * 100)).padStart(3, ' ')}%`;
    ctx.fillStyle = v >= 0.999 ? 'rgba(111,240,168,.95)' : (v > 0.01 ? 'rgba(255,181,71,.9)' : 'rgba(116,131,143,.55)');
    ctx.fillText(txt, hx, H * .16);
    hx += ctx.measureText(txt).width + 16;
  });

  if (S.finale) {
    ctx.fillStyle = `rgba(255,60,60,${0.1 + 0.08 * Math.sin(now * .006)})`; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,90,82,.95)'; ctx.font = '600 12px "IBM Plex Mono", monospace';
    if (Math.floor(now / 500) % 2) ctx.fillText('◤ INCOMING SIGNAL ◢', W * .06, H * .8);
  }
}

/* ======================================================================
   RENDERING (DOM)
   ====================================================================== */
function buildKeyboard() {
  const kb = $('#kb'); kb.innerHTML = '';
  ROWS.forEach(row => {
    const r = document.createElement('div'); r.className = 'kr';
    row.forEach(([code, finger, u, en, uk, label]) => {
      const k = document.createElement('div');
      k.id = 'k-' + code;
      k.className = 'key' + (code.startsWith('_') ? ' gap' : '') + (label && code !== 'Space' ? ' mod' : '') + (BUMPS.has(code) ? ' bump' : '');
      if (code === 'Space') k.classList.add('mod');
      k.style.setProperty('--u', u);
      k.style.setProperty('--fc', FINGER_COLOR[finger]);
      r.appendChild(k);
    });
    kb.appendChild(r);
  });
  const fg = $('#fingers'); fg.innerHTML = '';
  ['lp','lr','lm','li','th','ri','rm','rr','rp'].forEach(f => {
    const p = document.createElement('span'); p.className = 'fp' + (f === 'li' ? ' split' : '') + (f === 'th' ? ' split' : '');
    p.dataset.f = f; p.style.setProperty('--fc', FINGER_COLOR[f]);
    fg.appendChild(p);
  });
}

function renderKeyboard() {
  const on = onlineKeys();
  const target = expectedCode();
  for (const code in KEY) {
    if (code.startsWith('_')) continue;
    const el = document.getElementById('k-' + code); if (!el) continue;
    const k = KEY[code];
    el.textContent = code === 'Space' ? t('space') : (k.label || (k[S.lang] || '').toUpperCase());
    el.classList.toggle('on', on.has(code));
    el.classList.toggle('target', code === target);
  }
  const tf = target ? KEY[target].finger : null;
  document.querySelectorAll('.fp').forEach(p => {
    p.innerHTML = `<i></i>${FINGER_SHORT[S.lang][p.dataset.f]}`;
    p.classList.toggle('active', p.dataset.f === tf);
  });
}

function renderTerminal() {
  const el = $('#terminal');
  const lv = L(), lt = LT();

  if (S.finale && S.phase === 'finale') {
    el.innerHTML = `<div class="done enc">
      <span class="label">${esc(t('incoming'))}</span>
      <h3>${esc(t('encrypted'))}</h3>
      <div class="waiting">${esc(t('decOff'))}</div>
      <div class="label" style="color:var(--phos)">${esc(t('act2'))}</div>
      <div class="actions"><button class="btn" id="bReplay">${esc(t('replay'))}</button><button class="btn" id="bReset">${esc(t('reset'))}</button></div>
    </div>`;
    $('#bReplay').onclick = () => startLevel(0);
    $('#bReset').onclick = () => { S.done = { en: [0,0,0,0,0], uk: [0,0,0,0,0] }; save(); startLevel(0); };
    return;
  }
  if (S.finale) {
    el.innerHTML = `<div class="term-head"><span class="label kind">${esc(t('encrypted'))}</span></div>
      <div class="waiting"><kbd>${esc(t('spaceKey'))}</kbd> ${esc(t('cont'))}</div>`;
    return;
  }

  if (S.levelDone) {
    const stars = [0, 1, 2].map(i => i < S.lastStars ? '★' : '☆').join('');
    el.innerHTML = `<div class="done">
      <h3>${esc(lv.sys[S.lang].toUpperCase())} ${esc(t('online'))}</h3>
      <div class="row"><span class="stars">${stars}</span><span class="label">${esc(t('acc'))}<b>${S.lastAcc}%</b></span><span class="label">${esc(t('wpm'))}<b>${S.lastWpm}</b></span></div>
      <div class="waiting"><kbd>${esc(t('spaceKey'))}</kbd> ${esc(S.phase === 'complete' ? t('nextSys') : t('cont'))}</div>
    </div>`;
    return;
  }

  if (S.phase === 'dialogue') {
    el.innerHTML = `<div class="term-head"><span class="label kind">${esc(t('incoming'))}</span><span class="label">${esc(lv.sys[S.lang])}</span></div>
      <div class="waiting"><kbd>${esc(t('spaceKey'))}</kbd> ${esc(t('cont'))}</div>`;
    return;
  }

  // drill
  const line = curLine();
  const kindLabel = line.kind === 'locate' ? t('locate') : (line.kind === 'code' ? lv.codeLabel[S.lang] : t('boot'));
  const curCode = codeOf(line.text[S.ch]);
  const curColor = curCode ? FINGER_COLOR[KEY[curCode].finger] : 'var(--phos)';
  const chars = [...line.text].map((c, i) => {
    const cls = ['c', i < S.ch ? 'ok' : (i === S.ch ? 'cur' : ''), c === ' ' ? 'sp' : ''].join(' ');
    return `<span class="${cls}">${c === ' ' ? '␣' : esc(c)}</span>`;
  }).join('');
  const finger = curCode ? FINGER_NAME[S.lang][KEY[curCode].finger] : '';
  el.innerHTML = `
    <div class="term-head"><span class="label kind">${esc(kindLabel)}</span><span class="label">${esc(lv.sys[S.lang])} · ${esc(t('step'))} ${S.lineIdx + 1}/${S.lines.length}</span></div>
    <div class="progress"><i style="width:${(liveProgress() * 100).toFixed(1)}%"></i></div>
    <div class="term-line" id="termLine" style="--cur:${curColor}"><span class="prompt">&gt;</span>${chars}</div>
    <div class="term-foot"><span class="finger">${esc(t('next'))}: <b>${esc(keyLabel(curCode || ''))}</b> · ${esc(finger)}</span><span class="msg">${esc(S.msg)}</span></div>`;
}

function renderSystems() {
  const el = $('#systems');
  el.innerHTML = `<span class="tag">${esc(t('systems'))}</span>` + LEVELS.map((lv, i) => {
    const stars = S.done[S.lang][i];
    const current = i === S.lvl && !S.finale;
    let cls = 'offline', st = t('offline');
    if (stars) { cls = 'online'; st = '★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars); }
    else if (current && S.phase !== 'dialogue') { cls = 'booting'; st = Math.round(liveProgress() * 100) + '%'; }
    const keys = lv.newKeys.map(keyLabel).join(' ');
    return `<button class="sys ${cls} ${current ? 'current' : ''}" data-i="${i}"><span class="led"></span><span class="nm">${esc(lv.sys[S.lang])}</span><span class="keys">${esc(keys)}</span><span class="st">${esc(st)}</span></button>`;
  }).join('');
  el.querySelectorAll('.sys').forEach(b => b.onclick = () => { initAudio(); startLevel(+b.dataset.i); b.blur(); });
}

function renderStats() {
  let wpm = 0;
  if (S.startT && S.correct) wpm = Math.round((S.correct / 5) / Math.max(0.05, (performance.now() - S.startT) / 60000));
  const acc = S.total ? Math.round(S.correct / S.total * 100) : 100;
  $('#rWpm').textContent = wpm; $('#rAcc').textContent = acc + '%';
  return { wpm, acc };
}

function renderChrome() {
  $('#actLabel').textContent = t('act');
  $('#deckLabel').textContent = t('deck');
  $('#deckHint').textContent = t('tabHint');
  $('#soundBtn').textContent = t('sound')[S.sound ? 0 : 1];
  $('#langEN').classList.toggle('on', S.lang === 'en');
  $('#langUK').classList.toggle('on', S.lang === 'uk');
  document.documentElement.lang = S.lang === 'uk' ? 'uk' : 'en';
}

function renderLeds() { const d = S.done[S.lang]; document.querySelectorAll('#leds i').forEach((l, i) => l.classList.toggle('on', !!d[i] || S.finale)); }
function renderAll() { renderLeds(); renderChrome(); renderTerminal(); renderSystems(); renderKeyboard(); renderStats(); renderCrtText(); }

/* ======================================================================
   FLOW
   ====================================================================== */
function buildLines(lv) {
  const lt = lv[S.lang], out = [];
  lv.newKeys.forEach(code => out.push({ kind: 'locate', text: charOf(code).repeat(3), code }));
  lt.drills.forEach(text => out.push({ kind: 'boot', text }));
  out.push({ kind: 'code', text: lt.code });
  return out;
}

function startLevel(i) {
  clearInterval(S.typer);
  S.lvl = i; S.finale = false; S.crtMode = 'ora'; S.levelDone = false;
  S.lines = buildLines(L()); S.lineIdx = 0; S.ch = 0; S.msg = '';
  S.correct = 0; S.total = 0; S.startT = null;
  say(LT().intro, beginDrill);
}

function beginDrill() {
  S.phase = 'drill';
  sfx.unlock();
  L().newKeys.forEach(code => {
    const el = document.getElementById('k-' + code);
    if (el) { el.classList.remove('powering'); void el.offsetWidth; el.classList.add('powering'); }
  });
  lineRemark();
  renderAll();
}

function lineRemark() {
  const line = curLine(); if (!line) return;
  if (line.kind === 'locate') {
    const code = line.code;
    remark(`${t('find')} ${keyLabel(code)}. ${FINGER_NAME[S.lang][KEY[code].finger]}.`);
  } else if (line.kind === 'code') remark(t('lastOne'));
  else if (S.lineIdx === 0 || S.lines[S.lineIdx - 1].kind === 'locate') remark(LT().tip);
}

function completeLevel() {
  const { wpm, acc } = renderStats();
  const stars = acc >= 97 ? 3 : acc >= 90 ? 2 : 1;
  S.lastStars = stars; S.lastWpm = wpm; S.lastAcc = acc;
  S.done[S.lang][S.lvl] = Math.max(S.done[S.lang][S.lvl], stars);
  save();
  S.levelDone = true;
  sfx.online();
  say([LT().outro], () => { S.phase = 'complete'; renderAll(); });
}

function nextLevel() {
  if (S.lvl < LEVELS.length - 1) startLevel(S.lvl + 1);
  else startFinale();
}

function startFinale() {
  clearInterval(S.typer);
  S.finale = true; S.levelDone = false; S.crtMode = 'enemy';
  sfx.glitch();
  say(FINALE[S.lang], () => { S.phase = 'finale'; renderAll(); });
}

/* ---------- Input ---------- */
const MODS = ['ShiftLeft','ShiftRight','ControlLeft','ControlRight','AltLeft','AltRight','MetaLeft','MetaRight','CapsLock'];
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  initAudio();
  const kEl = document.getElementById('k-' + e.code);
  if (kEl) kEl.classList.add('pressed');

  if (e.code === 'Tab') {
    e.preventDefault();
    if (S.phase === 'drill') { S.ch = 0; S.msg = ''; renderTerminal(); renderKeyboard(); }
    return;
  }
  if (S.phase === 'dialogue' || S.phase === 'complete') {
    if (e.key === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      if (S.phase === 'dialogue') advanceDialogue(); else nextLevel();
    }
    return;
  }
  if (S.phase !== 'drill' || MODS.includes(e.code) || e.repeat) return;
  if (KEY[e.code] || e.code === 'Space') e.preventDefault();

  const line = curLine(); const expected = line.text[S.ch];
  const mapped = charOf(e.code);                        // auto-map: physical key → layout char
  const ok = mapped === expected || (e.key && e.key.toLowerCase() === expected);
  if (!S.startT) S.startT = performance.now();
  S.total++;

  if (ok) {
    S.correct++; S.ch++; S.msg = '';
    const now = performance.now(), dt = now - S.lastKey; S.lastKey = now;
    const inst = dt < 1500 ? Math.min(1.6, (1000 / dt) / 4) : 0.15;
    S.cadence = S.cadence * 0.65 + inst * 0.35;
    sfx.key();
    if (S.ch >= line.text.length) {
      S.lineIdx++; S.ch = 0;
      if (S.lineIdx >= S.lines.length) { S.lineIdx = S.lines.length - 1; S.ch = line.text.length; completeLevel(); return; }
      lineRemark();
    }
  } else {
    sfx.err();
    S.cadence *= 0.5;
    const pressedOnline = onlineKeys().has(e.code);
    S.msg = pressedOnline || !KEY[e.code] ? t('wrongKey') : t('offKey');
    if (kEl) { kEl.classList.add('wrong'); setTimeout(() => kEl.classList.remove('wrong'), 220); }
  }
  renderTerminal(); renderKeyboard(); renderSystems(); renderStats();
  if (!ok) { const tl = $('#termLine'); if (tl) { tl.classList.remove('shake'); void tl.offsetWidth; tl.classList.add('shake'); } }
});
window.addEventListener('keyup', (e) => {
  const el = document.getElementById('k-' + e.code); if (el) el.classList.remove('pressed');
});

$('#langEN').onclick = (e) => { e.currentTarget.blur(); if (S.lang !== 'en') { S.lang = 'en'; save(); startLevel(firstOpen()); } };
$('#langUK').onclick = (e) => { e.currentTarget.blur(); if (S.lang !== 'uk') { S.lang = 'uk'; save(); startLevel(firstOpen()); } };
$('#soundBtn').onclick = (e) => {
  e.currentTarget.blur(); initAudio();
  S.sound = !S.sound; if (master) master.gain.value = S.sound ? 0.9 : 0; renderChrome();
};
function firstOpen() { const i = S.done[S.lang].findIndex(s => !s); return i < 0 ? 0 : i; }

/* ---------- Canvas sizing + loop ---------- */
function fit(obj, sel) {
  const cv = $(sel), r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  obj.cv = cv; obj.ctx = cv.getContext('2d'); obj.w = r.width; obj.h = r.height;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  obj.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function resize() { fit(view, '#view'); fit(face, '#face'); initStars(); }
window.addEventListener('resize', resize);
if (window.ResizeObserver) { const ro = new ResizeObserver(() => resize()); ro.observe($('#view')); ro.observe($('#face')); }

function loop(now) {
  if (now - S.lastKey > 900) S.cadence *= 0.985;
  const target = targetPowers();
  for (let i = 0; i < 5; i++) view.pw[i] += (target[i] - view.pw[i]) * 0.05;
  drawView(now, view.pw);
  drawFace(now);
  updateAudio(now, view.pw);
  requestAnimationFrame(loop);
}

load();
buildKeyboard();
resize();
startLevel(firstOpen());
requestAnimationFrame(loop);
</script>
</body>
</html>
